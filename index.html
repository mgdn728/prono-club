<style>
:root{
  --bg:#0a0e13;--panel:#111821;--card:#161f2a;--card2:#1c2734;--line:#253244;
  --text:#e9eff6;--muted:#8796a8;--acc:#1fd47e;--acc-ink:#04130b;--coin:#f6c445;--dia:#62c6ff;--bad:#ff5d6c;
  --r:14px;
}
body.theme-gold{--acc:#f2b632;--acc-ink:#1a1200}
body.theme-purple{--acc:#a983ff;--acc-ink:#12082a}
body.theme-red{--acc:#ff5a5f;--acc-ink:#220405}
body.theme-luxe{--acc:#d4af37;--acc-ink:#0b0b0b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:15px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed}
input{font:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}

/* header */
header{padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:20;background:rgba(10,14,19,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:14px;height:62px}
.brand{font-weight:800;font-size:20px;letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
.brand i{font-style:normal;display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--acc);color:var(--acc-ink);font-size:17px}
.brand span{color:var(--acc)}
.title-chip{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;border:1px solid var(--acc);color:var(--acc);white-space:nowrap}
.bal{margin-left:auto;display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);padding:7px 12px;border-radius:99px;font-weight:700;white-space:nowrap}
.pill.coin b{color:var(--coin)} .pill.dia b{color:var(--dia)}
.pill small{color:var(--muted);font-weight:500}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{padding:11px 14px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:var(--text);border-color:var(--acc)}
nav .badge{background:var(--acc);color:var(--acc-ink);border-radius:99px;font-size:11px;padding:1px 6px;margin-left:4px}

/* layout */
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;padding:20px 0 120px}
.reset-note{color:var(--muted);font-size:13px;margin:0 0 14px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{padding:7px 12px;border-radius:8px;color:var(--muted);font-weight:600;font-size:14px}
.seg button.on{background:var(--card2);color:var(--text)}
.chip{padding:7px 12px;border-radius:99px;border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:13px;background:var(--panel)}
.chip.on{border-color:var(--acc);color:var(--text);background:color-mix(in srgb,var(--acc) 14%,transparent)}

/* match */
.match{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.mrow{display:grid;grid-template-columns:1fr auto;gap:14px;padding:14px;align-items:center}
.mmeta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:8px}
.st{font-weight:700;padding:2px 7px;border-radius:6px;background:var(--card2);color:var(--text)}
.st.live{background:var(--bad);color:#fff}
.st.done{background:transparent;border:1px solid var(--line);color:var(--muted)}
.teams{display:grid;gap:4px;font-weight:600}
.teams div{display:flex;justify-content:space-between;gap:10px}
.teams .sc{font-weight:800;min-width:18px;text-align:right}
.teams .win{color:var(--acc)}
.quick{display:grid;grid-template-columns:repeat(3,78px);gap:6px}
.odd{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 6px;min-height:50px;transition:.12s}
.odd span{font-size:11px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.odd b{font-size:15px}
.odd:hover:not(:disabled){border-color:var(--acc)}
.odd.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.odd.on span{color:var(--acc-ink)}
.odd:disabled{opacity:.4}
.odd.wonopt{border-color:var(--acc);opacity:1}
.mfoot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:8px 14px}
.link{color:var(--acc);font-weight:600;font-size:13px;padding:4px 0}
.ghost{font-size:12px;color:var(--muted);font-weight:600;padding:5px 9px;border:1px dashed var(--line);border-radius:8px}
.ghost:hover{color:var(--text);border-color:var(--muted)}
.markets{border-top:1px solid var(--line);padding:6px 14px 14px;background:color-mix(in srgb,var(--panel) 60%,var(--bg))}
.mk{margin-top:12px}
.mk h4{margin:0 0 7px;font-size:13px;color:var(--muted);font-weight:600}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px}
.opts.cs{grid-template-columns:repeat(auto-fill,minmax(72px,1fr))}

/* slip */
aside{position:sticky;top:120px;align-self:start}
.slip{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.slip-h{display:flex;align-items:center;justify-content:space-between;padding:14px;border-bottom:1px solid var(--line);font-weight:800}
.slip-h .x{display:none;font-size:22px;color:var(--muted)}
.slip-b{padding:12px 14px;max-height:calc(100vh - 330px);overflow:auto}
.empty{color:var(--muted);text-align:center;padding:28px 10px;font-size:14px;line-height:1.5}
.sel{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 11px;margin-bottom:8px}
.sel .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.sel .pick{font-weight:700}
.sel .sub{font-size:12px;color:var(--muted);margin-top:2px}
.sel .o{font-weight:800;color:var(--acc)}
.sel .rm{color:var(--muted);font-size:18px;line-height:1;margin-left:6px}
.stake{display:flex;align-items:center;gap:8px;margin-top:8px}
.stake input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 10px;font-weight:700}
.stake input:focus{outline:none;border-color:var(--acc)}
.stake .g{font-size:12px;color:var(--muted);white-space:nowrap}
.quickstake{display:flex;gap:5px;margin-top:7px}
.quickstake button{flex:1;font-size:12px;font-weight:700;padding:5px 0;border-radius:7px;background:var(--card2);color:var(--muted)}
.quickstake button:hover{color:var(--text)}
.slip-f{border-top:1px solid var(--line);padding:12px 14px}
.row{display:flex;justify-content:space-between;font-size:14px;margin:4px 0}
.row .v{font-weight:700}
.row.big .v{color:var(--dia);font-size:17px}
.extras{display:grid;gap:6px;margin:8px 0}
.extras label{display:flex;gap:8px;align-items:center;font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 9px;cursor:pointer}
.extras label.off{opacity:.45;cursor:not-allowed}
.btn{width:100%;background:var(--acc);color:var(--acc-ink);font-weight:800;padding:13px;border-radius:11px;font-size:15px;margin-top:8px}
.btn:disabled{opacity:.45}
.err{color:var(--bad);font-size:13px;margin-top:6px;min-height:1px}
.fab{display:none}

/* bets & shop */
.h2{font-size:20px;font-weight:800;margin:0 0 4px}
.sub2{color:var(--muted);margin:0 0 16px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat small{color:var(--muted);font-size:12px}
.stat b{display:block;font-size:20px;margin-top:3px}
.bet{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.bet .bh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.tag{font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px}
.tag.pending{background:var(--card2);color:var(--muted)}
.tag.won{background:color-mix(in srgb,var(--acc) 20%,transparent);color:var(--acc)}
.tag.lost{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.bl{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0;border-top:1px dashed var(--line)}
.bl:first-of-type{border-top:0}
.bl .s{color:var(--muted);font-size:12px}
.mark{font-weight:800}
.mark.ok{color:var(--acc)} .mark.ko{color:var(--bad)}
.bf{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--muted)}
.bf b{color:var(--text)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.item .ic{font-size:30px}
.item h3{margin:0;font-size:16px}
.item p{margin:0;color:var(--muted);font-size:13px;line-height:1.45;flex:1}
.item .cost{font-weight:800;color:var(--dia)}
.item button{background:var(--card2);border:1px solid var(--line);padding:10px;border-radius:10px;font-weight:700}
.item button.buy{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.item button:disabled{opacity:.45}
.item .own{font-size:12px;color:var(--acc);font-weight:700}
.sec{font-size:14px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:22px 0 10px}
.rules{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;line-height:1.6}
.rules h3{margin:18px 0 6px}
.rules h3:first-child{margin-top:0}
.rules ul{margin:0;padding-left:20px}
.disc{color:var(--muted);font-size:13px;margin-top:18px;border-top:1px solid var(--line);padding-top:14px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);opacity:0;background:var(--card2);border:1px solid var(--line);padding:12px 18px;border-radius:12px;font-weight:700;z-index:95;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:900px){
  main{grid-template-columns:1fr}
  aside{position:fixed;inset:auto 0 0 0;top:auto;z-index:50;transform:translateY(105%);transition:.25s}
  aside.open{transform:none}
  .slip{border-radius:18px 18px 0 0;max-height:85vh;display:flex;flex-direction:column}
  .slip-b{max-height:none;flex:1}
  .slip-h .x{display:block}
  .fab{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;background:var(--acc);color:var(--acc-ink);border-radius:14px;padding:14px 16px;font-weight:800;justify-content:space-between;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .fab.hide{display:none}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:560px){
  .hbar{gap:8px}
  .brand{font-size:17px}
  .title-chip{display:none}
  .pill{padding:6px 9px;font-size:14px}
  .pill small{display:none}
  .mrow{grid-template-columns:1fr}
  .quick{grid-template-columns:repeat(3,1fr)}
}

/* comptes */
.pill.user{cursor:pointer;color:var(--text)}
.pill.user:hover{border-color:var(--acc)}
.modal{position:fixed;inset:0;z-index:80;background:rgba(5,8,12,.82);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.auth{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px}
.auth .brand{justify-content:center;font-size:24px;margin-bottom:6px}
.auth p.lead{text-align:center;color:var(--muted);margin:0 0 18px;font-size:14px;line-height:1.5}
.auth .seg{margin-bottom:16px}
.auth .seg button{flex:1}
.auth label{display:block;font-size:13px;color:var(--muted);font-weight:600;margin:10px 0 5px}
.auth input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 12px;font-size:15px}
.auth input:focus{outline:none;border-color:var(--acc)}
.auth .hint{font-size:12px;color:var(--muted);margin-top:5px}
.auth .err{text-align:center;margin-top:10px}
.auth .menu{display:grid;gap:8px;margin-top:8px}
.auth .menu button{background:var(--card2);border:1px solid var(--line);padding:11px;border-radius:10px;font-weight:700}
.board{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.wprize{margin:0 0 12px;padding:14px 16px;border-radius:18px;background:linear-gradient(135deg,#fff6d6,#ffe7b0);border:1px solid #f5d27a;color:#3a2600}
.wprize>b{display:block;font-size:15px;margin-bottom:8px}.wprize small{display:block;font-size:12px;opacity:.8;margin-top:8px}
.wp-row{display:flex;gap:6px;flex-wrap:wrap}.wp-row span{flex:1;min-width:92px;text-align:center;background:#fff;border-radius:12px;padding:7px 4px;font-weight:800;font-size:14px;box-shadow:0 2px 6px rgba(120,80,0,.12)}
.wp-last{margin-top:8px;font-size:13px}.wp-last b{cursor:pointer;text-decoration:underline dotted}
.brow .val .prize{display:block;font-style:normal;font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;margin-bottom:3px;text-align:center;white-space:nowrap;background:#fff2c2;color:#7a5200}
.brow .val .prize.p2{background:#eef1f6;color:#4a5466}.brow .val .prize.p3{background:#fbe3d2;color:#7a3f12}
.brow{display:grid;grid-template-columns:44px 1fr auto auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.brow:first-child{border-top:0}
.brow .rk{font-weight:800;color:var(--muted);text-align:center}
.brow.me{background:color-mix(in srgb,var(--acc) 12%,transparent)}
.brow .d{font-weight:800;color:var(--dia)}
.brow .w{color:var(--muted);font-size:13px}
.install{display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--acc) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--acc) 45%,var(--line));border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.install img{width:40px;height:40px;border-radius:10px}
.install div{flex:1;font-size:14px;line-height:1.4}
.install .go{background:var(--acc);color:var(--acc-ink);font-weight:800;padding:9px 14px;border-radius:10px;white-space:nowrap}
.install .no{color:var(--muted);font-size:20px;padding:0 4px}
.ios-steps{text-align:left;line-height:1.7;margin:0 0 14px;padding-left:20px}

/* ===== Thème « rouge sport » ===== */
:root{
  --bg:#eef0f4;--panel:#ffffff;--card:#f3f4f7;--card2:#e7e9ee;--line:#dde1e8;
  --text:#121722;--muted:#687285;--acc:#e0182d;--acc-ink:#ffffff;--coin:#c88a00;--dia:#1a73d9;--bad:#e0182d;
  --head:#161b26;--head2:#202736;--good:#14a05a;
}
body.theme-gold{--acc:#d99a00;--acc-ink:#1a1200}
body.theme-purple{--acc:#7b3fe4;--acc-ink:#fff}
body.theme-red{--acc:#b30f22;--acc-ink:#fff}
body.theme-luxe{--acc:#b8902a;--acc-ink:#0b0b0b}
header{background:var(--head);border-bottom:0;box-shadow:0 2px 0 var(--acc)}
header .brand,header .pill{color:#fff}
header .brand span{color:var(--acc)}
.brand i{background:var(--acc);color:#fff}
header .pill,header .pill.user{background:var(--head2);border-color:#2c3446;color:#fff}
header .pill.coin b{color:#ffc93c} header .pill.dia b{color:#6cc0ff}
header .pill small{color:#9aa4b8}
header .title-chip{border-color:#fff;color:#fff}
nav#nav button{color:#a8b1c3}
nav#nav button.on{color:#fff;border-color:var(--acc)}
.modal{background:rgba(18,23,34,.7)}
.auth .brand{color:var(--text)}
.toast{background:var(--head);color:#fff;border-color:var(--head)}
.hero{background:linear-gradient(110deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#5a0010));color:#fff;border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.hero b{display:block;font-size:17px}
.hero span{font-size:13px;opacity:.9}
.toolbar{gap:10px}
.chips-m{display:none;gap:8px;overflow-x:auto;width:100%;padding-bottom:2px}
.chips-m .chip{white-space:nowrap}
.mlayout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:16px;align-items:start}
.side{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px;position:sticky;top:120px}
.side-h{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 10px}
.side button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;padding:9px 10px;border-radius:9px;font-weight:600;font-size:14px}
.side button:hover{background:var(--card)}
.side button.on{background:color-mix(in srgb,var(--acc) 10%,transparent);color:var(--acc)}
.side small{background:var(--card2);color:var(--muted);border-radius:99px;padding:1px 7px;font-size:11px;font-weight:700}
.grp{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.grp-h{display:grid;grid-template-columns:minmax(0,1fr) 258px 44px;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line);font-weight:800;font-size:14px}
.grp-h .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;color:var(--muted);font-size:12px}
.grp-h .cols i{font-style:normal}
.mrow2{display:grid;grid-template-columns:58px minmax(0,1fr) 258px 44px;gap:8px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.grp .mrow2:nth-child(2){border-top:0}
.mrow2.open{background:color-mix(in srgb,var(--acc) 4%,transparent)}
.when{font-size:12px;text-align:center;line-height:1.25}
.when .st{background:transparent;color:var(--text);font-weight:700;padding:0}
.when .st.live{background:var(--acc);color:#fff;padding:2px 6px;border-radius:5px}
.when .st.done{border:0;color:var(--muted);font-size:11px}
.tm{display:grid;gap:3px;text-align:left;min-width:0;font-weight:600;font-size:14px}
.tm span{display:flex;justify-content:space-between;gap:8px}
.tm i{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm .sc{min-width:16px;text-align:right}

.bj-lbl b{color:#ffe27a;font-size:15px;margin-left:6px}.bj-lbl b small{color:#fff;opacity:.75;font-size:11px;font-weight:600}
.bj-lbl.late b{animation:bjfade .3s ease 1.25s both}
@keyframes bjfade{from{opacity:0}to{opacity:1}}
.bj-hand{display:flex;justify-content:center;min-height:102px;padding-left:28px}
.bj-ph{width:70px;height:100px;border-radius:9px;border:2px dashed rgba(255,255,255,.25);margin-left:-28px}
.bj-mid{position:relative;z-index:3;min-height:58px;display:grid;place-items:center;text-align:center}
.bj-arc span{display:inline-block;font-size:11px;font-weight:900;letter-spacing:1.6px;color:#ffd54a;border-top:1.5px solid rgba(255,213,74,.55);border-bottom:1.5px solid rgba(255,213,74,.55);padding:4px 10px}
.bj-arc small{display:block;font-size:10.5px;opacity:.75;margin-top:4px}
.bj-res{padding:9px 24px;border-radius:99px;box-shadow:0 8px 22px rgba(0,0,0,.35);display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.bj-res b{font-size:20px;font-weight:900}.bj-res span{font-size:14px;font-weight:800}
.bj-res.win{background:linear-gradient(135deg,#ffe066,#ffab1a);color:#3a2300}
.bj-res.push{background:linear-gradient(135deg,#eef2f8,#b9c4d8);color:#1b2230}
.bj-res.lose{background:linear-gradient(135deg,#ff4d6d,#a80f2a);color:#fff}
.bj-res.pop{animation:bjpop .5s cubic-bezier(.2,1.7,.4,1) both}
@keyframes bjpop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.card{width:70px;height:100px;margin-left:-28px;perspective:700px;flex:0 0 auto;filter:drop-shadow(0 5px 7px rgba(0,0,0,.38));--fx:150px;--fy:-250px}
.bj-zone.top .card{--fy:-30px}
.card .in{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.card.back .in{transform:rotateY(180deg)}
.card .cf,.card .cb{position:absolute;inset:0;border-radius:9px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.card .cf{background:linear-gradient(160deg,#fff,#f1f1f4);color:#15171c;font-family:Georgia,'Times New Roman',serif;font-weight:700;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.card.red .cf{color:#d0102b}
.c-tl,.c-br{position:absolute;font-size:15px;line-height:1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px}
.c-tl i,.c-br i{font-style:normal;font-size:12px}
.c-tl{top:6px;left:6px}.c-br{bottom:6px;right:6px;transform:rotate(180deg)}
.c-mid{position:absolute;inset:0;display:grid;place-items:center;font-size:36px}
.c-mid.fig{inset:16px 14px;border:1.5px solid currentColor;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;opacity:.95;background:rgba(0,0,0,.03)}
.c-mid.fig b{font-size:26px;line-height:1}.c-mid.fig i{font-style:normal;font-size:16px;line-height:1}
.card .cb{transform:rotateY(180deg);background:repeating-linear-gradient(45deg,#b3122e 0 6px,#8d0d24 6px 12px);border:3px solid #fff;display:grid;place-items:center}
.card .cb span{width:30px;height:30px;border-radius:50%;background:#fff;color:#b3122e;font:900 17px/30px sans-serif;text-align:center}
.card.deal{animation:bjdeal .5s cubic-bezier(.2,.75,.25,1) both;animation-delay:var(--d)}
@keyframes bjdeal{from{transform:translate(var(--fx),var(--fy)) rotate(-28deg) scale(.6);opacity:0}15%{opacity:1}to{transform:none;opacity:1}}
.card.flipin .in{animation:bjflip .42s ease both;animation-delay:calc(var(--d) + .3s)}
.card.reveal .in{animation:bjflip .5s ease both}
@keyframes bjflip{from{transform:rotateY(180deg)}to{transform:rotateY(0)}}
.bj-bet{position:absolute;left:14px;bottom:14px;z-index:4;display:flex;flex-direction:column;align-items:center;gap:4px}
.bj-bet b{font-size:12.5px;font-weight:900;background:rgba(0,0,0,.45);padding:2px 9px;border-radius:99px;color:#ffe27a}
.bj-bet .stk{position:relative;width:40px;height:34px}
.bj-bet .stk i{position:absolute;left:0;width:40px;height:26px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#ffe58a,#d4a017 70%);border:3px dashed #fff8d6;box-shadow:0 3px 0 #8a6508,0 5px 6px rgba(0,0,0,.35)}
.bj-bet .stk i:nth-child(1){bottom:0}.bj-bet .stk i:nth-child(2){bottom:5px}.bj-bet .stk i:nth-child(3){bottom:10px}
.bj-bet.in{animation:bjchip .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes bjchip{from{transform:translateY(140px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.bj-bet.gone{animation:bjgone .7s ease-in both}
@keyframes bjgone{to{transform:translate(120px,-300px) scale(.5);opacity:0}}
.bj-bet.paid .stk{animation:bjpaid .6s cubic-bezier(.2,1.6,.4,1) both}
.bj-bet.paid b{background:#ffd43b;color:#3a2300}
@keyframes bjpaid{0%{transform:scale(1)}50%{transform:scale(1.35) translateY(-6px)}100%{transform:scale(1.12)}}
.bj-coins{position:absolute;left:50%;bottom:90px;z-index:6;pointer-events:none}
.bj-coins i{position:absolute;font-style:normal;font-size:22px;opacity:0;animation:bjcoin 1.1s ease-out both}
.bj-coins i:nth-child(1){--x:-120px;--y:-170px}.bj-coins i:nth-child(2){--x:-80px;--y:-230px;animation-delay:.05s}.bj-coins i:nth-child(3){--x:-40px;--y:-190px;animation-delay:.1s}
.bj-coins i:nth-child(4){--x:0px;--y:-250px;animation-delay:.03s}.bj-coins i:nth-child(5){--x:40px;--y:-200px;animation-delay:.12s}.bj-coins i:nth-child(6){--x:80px;--y:-235px;animation-delay:.07s}
.bj-coins i:nth-child(7){--x:120px;--y:-165px;animation-delay:.02s}.bj-coins i:nth-child(8){--x:-100px;--y:-110px;animation-delay:.15s}.bj-coins i:nth-child(9){--x:100px;--y:-115px;animation-delay:.17s}
.bj-coins i:nth-child(10){--x:-60px;--y:-280px;animation-delay:.2s}.bj-coins i:nth-child(11){--x:60px;--y:-285px;animation-delay:.22s}.bj-coins i:nth-child(12){--x:-140px;--y:-240px;animation-delay:.25s}
.bj-coins i:nth-child(13){--x:140px;--y:-245px;animation-delay:.27s}.bj-coins i:nth-child(14){--x:0px;--y:-310px;animation-delay:.3s}
@keyframes bjcoin{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:1}70%{opacity:1}100%{transform:translate(var(--x),var(--y)) scale(1.15) rotate(360deg);opacity:0}}
.bj-table.fx-win{animation:bjglow 1.2s ease-out}
@keyframes bjglow{0%,100%{box-shadow:inset 0 0 0 2px #d9ae3c,inset 0 14px 50px rgba(0,0,0,.35),0 16px 32px rgba(13,18,32,.28)}35%{box-shadow:inset 0 0 0 3px #ffe27a,inset 0 0 70px rgba(255,220,90,.55),0 0 40px rgba(255,200,40,.75)}}
.bj-table.fx-lose{animation:bjshake .45s ease}
@keyframes bjshake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.chip{width:54px;height:54px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;background:var(--cc);border:5px dashed rgba(255,255,255,.9);box-shadow:0 0 0 3px var(--cc),0 4px 0 3px rgba(0,0,0,.28),0 9px 12px rgba(0,0,0,.25);cursor:pointer;transition:transform .12s}
.chip span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:900 12.5px/1 sans-serif;background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55)}
.chip:active{transform:translateY(3px) scale(.94)}.chip:disabled{opacity:.3}
.chip.c50{--cc:#1f7bff}.chip.c100{--cc:#16181d}.chip.c250{--cc:#12a150}.chip.c500{--cc:#8a3dff}.chip.c1000{--cc:#d4a017}.chip.c5000{--cc:#e0182d}.chip.c10000{--cc:#0aa5b8}.chip.c50000{--cc:#ff7a00}.chip.c100000{--cc:#111;color:#ffd84d}
.bj-seg{margin-bottom:10px}.bj-seg button{flex:1}
.chip.sel{transform:translateY(-6px) scale(1.08);box-shadow:0 0 0 3px var(--cc),0 0 0 6px #ffd43b,0 10px 14px rgba(0,0,0,.28)}
.bj-me{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.bj-me div{background:linear-gradient(135deg,#0e7c45,#12a150);color:#fff;border-radius:16px;padding:12px;text-align:center}.bj-me small{display:block;font-size:11.5px;opacity:.9}.bj-me b{font-size:22px}
.bj-ctl{margin:14px 0 10px;display:flex;flex-direction:column;align-items:center;gap:12px}
.bj-ctl.acts{flex-direction:row;justify-content:center;gap:10px}
.bj-mise{display:flex;align-items:baseline;gap:8px}.bj-mise small{color:var(--muted);font-size:13px}.bj-mise b{font-size:26px;font-weight:900}
.bj-chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.bj-row{display:flex;gap:8px}
.bj-mini{padding:7px 14px;border-radius:99px;font-weight:800;font-size:13.5px;background:var(--card,#fff);box-shadow:0 2px 8px rgba(13,18,32,.1)}
.bj-deal{width:100%;max-width:360px;padding:16px;border-radius:18px;font-size:18px;font-weight:900;color:#3a2300;background:linear-gradient(180deg,#ffe066,#ffb703);box-shadow:0 5px 0 #c98500,0 14px 24px rgba(255,170,0,.3);transition:transform .1s,box-shadow .1s}
.bj-deal:active{transform:translateY(4px);box-shadow:0 1px 0 #c98500}
.bj-deal:disabled{opacity:.5}
.bj-a{flex:1;max-width:124px;padding:11px 6px 12px;border-radius:16px;font-size:15px;font-weight:900;color:#fff;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 5px 0 var(--sd),0 10px 16px rgba(0,0,0,.16);transition:transform .1s,box-shadow .1s,opacity .2s}
.bj-a i{font-style:normal;font-size:19px;line-height:1}
.bj-a:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sd)}
.bj-a.hit{background:linear-gradient(180deg,#22c55e,#12964a);--sd:#0b6b33}.bj-a.stand{background:linear-gradient(180deg,#ff4d6d,#d01a3c);--sd:#8f0e26}.bj-a.dbl{background:linear-gradient(180deg,#9b5cff,#6a2cf5);--sd:#4318ad}
.bj-a:disabled{opacity:.4}
.bj-note{text-align:center;color:var(--muted);font-size:14px;margin:0}
.bj-rules{font-size:12px;color:var(--muted);line-height:1.5;text-align:center;margin:8px 4px 20px}
@media(max-width:380px){.card{width:62px;height:90px;margin-left:-28px}.bj-ph{width:62px;height:90px}.bj-hand{min-height:92px}}
@media(prefers-reduced-motion:reduce){.card.deal,.card.flipin .in,.bj-coins i,.bj-table.fx-win,.bj-table.fx-lose{animation-duration:.01s;animation-delay:0s}}

const GRID=[];for(let i=1;i<=120;i++)GRID.push(i*0.05);
const PV=GRID.map(l=>{const v=[];for(let k=0;k<=14;k++)v.push(pois(k,l));return v});
const CV=PV.map(v=>{const c=[];let s=0;for(let k=0;k<=14;k++){c.push(s);s+=v[k]}return c});
function fitGoals(o){
  const inv=o.map(x=>1/x),s=inv[0]+inv[1]+inv[2],q=inv.map(x=>x/s);
  let best=1e9,bi=20,bj=20;
  for(let i=0;i<GRID.length;i++){const A=PV[i];
    for(let j=0;j<GRID.length;j++){const B=PV[j],C=CV[j];let p1=0,pn=0;
      for(let x=0;x<=14;x++){p1+=A[x]*C[x];pn+=A[x]*B[x]}
      const e=(p1-q[0])**2+(pn-q[1])**2+(1-p1-pn-q[2])**2;
      if(e<best){best=e;bi=i;bj=j}}}
  return[GRID[bi],GRID[bj]];
}
function fitHockey(o,T){ // total de buts fixé (≈6 en NHL), on ajuste la répartition sur les cotes 1 et 2
  const t=1/o[0]/(1/o[0]+1/o[2]);let best=1e9,bk=.5;
  for(let k=0.15;k<=0.85;k+=0.005){const lh=T*k,la=T*(1-k);let p1=0,p2=0;
    for(let i=0;i<=14;i++)for(let j=0;j<=14;j++){const p=pois(i,lh)*pois(j,la);if(i>j)p1+=p;else if(j>i)p2+=p}
    const e=Math.abs(p1/(p1+p2)-t);if(e<best){best=e;bk=k}}
  return[T*bk,T*(1-bk)];
}
const p2way=o=>{const a=1/o[0],b=1/o[1];return a/(a+b)};
function setsDist(p,bo){

  const win=q=>{let t=0;for(let w=0;w<n;w++)t+=C(n-1+w,w)*Math.pow(q,n)*Math.pow(1-q,w);return t};
  let lo=0.01,hi=0.99;for(let k=0;k<50;k++){const mid=(lo+hi)/2;if(win(mid)<p)lo=mid;else hi=mid}
  const q=(lo+hi)/2,d=[];

}
function invPhi(p){ // approximation de la loi normale inverse

  const pl=0.02425;let q,r;
  if(p<pl){q=Math.sqrt(-2*Math.log(p));return(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((dd[0]*q+dd[1])*q+dd[2])*q+dd[3])*q+1)}
  if(p>1-pl){q=Math.sqrt(-2*Math.log(1-p));return-(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((dd[0]*q+dd[1])*q+dd[2])*q+dd[3])*q+1)}
  q=p-0.5;r=q*q;return(((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);

function pointsDist(p,tl){
  const sdM=12,sdT=16,mu=sdM*invPhi(Math.min(.995,Math.max(.005,p))),d=[];

    for(let T=-60;T<=60;T+=2){const wT=g(T,sdT);d.push([(tl+T+D)/2,(tl+T-D)/2,wD*wT])}}

  const g=(x,s)=>Math.exp(-x*x/(2*s*s));
  for(let D=-Math.round(5*sdM);D<=Math.round(5*sdM);D++){const wD=g(D-mu,sdM);if(wD<1e-6)continue;
    for(let T=-Math.round(3*sdT);T<=Math.round(3*sdT);T+=2){d.push([(tl+T+D)/2,(tl+T-D)/2,wD*g(T,sdT)])}}

    const same=prev&&prev.o.join()===r.o.join()&&prev.tl===r.tl&&prev.bo===m.bo;

function slipCalc(){
  const sels=ui.slip.map(s=>{const m=findMatch(s.matchId);return{...s,m,odds:m?(s.bo||oddsOf(m,s.mk,s.opt)):1,open:m&&(m.L?liveOpen(m):status(m)==='avenir')}}).filter(s=>s.m);

    for(const s of sels){const st=Math.max(0,Math.floor(+ui.stakes[selKey(s)]||0));total+=st;gain+=st*s.odds*bm}
  }else{

    total=Math.max(0,Math.floor(+ui.combi||0));gain=total*combiOdds;

const monthId=()=>today().slice(0,7);
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const saisonNom=id=>'Saison de '+MOIS[(+String(id||monthId()).slice(5,7))-1];
function hstr(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h}
function shuffleBy(arr,seed){const a=arr.slice();let h=seed>>>0;for(let i=a.length-1;i>0;i--){h=(h*1103515245+12345)>>>0;const j=h%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function giveRw(r){if(!r)return;if(r.c)state.coins+=r.c;if(r.d)state.diamonds+=r.d;if(r.inv)state.inv[r.inv]=(state.inv[r.inv]||0)+1;
  if(r.own&&!state.owned.includes(r.own)){state.owned.push(r.own);const i=SHOP.find(x=>x.id===r.own);if(i&&EQUIP[i.kind])state[EQUIP[i.kind]]=eqVal(i)}}
function rwTxt(r){const p=[];if(r.c)p.push(nf(r.c)+' 🪙');if(r.d)p.push(nf(r.d)+' 💎');if(r.inv)p.push(r.inv==='boost'?'🚀 1 Boost':'🛡️ 1 Assurance');if(r.own){const i=SHOP.find(x=>x.id===r.own);if(i)p.push(i.ic+' '+i.name)}return p.join(' + ')}

let EVX=[];
async function loadEvents(){try{const r=await fetch('events.json?t='+Math.floor(Date.now()/6e5));if(r.ok){const a=await r.json();if(Array.isArray(a))EVX=a}}catch(e){}}
function events(){
  const d=new Date(),wd=d.getDay(),h=d.getHours(),L=[];
  if(wd===6||wd===0||(wd===5&&h>=18)){const e=new Date(d.getFullYear(),d.getMonth(),d.getDate()+(wd===5?2:wd===6?1:0),23,59,59);
    L.push({id:'we',ic:'⚡',nom:'Week-end double XP',desc:'XP ×2 et coffre du jour doublé',xp:2,chest:2,fin:+e})}
  if(wd===3&&h>=18)L.push({id:'wed',ic:'💎',nom:'Soirée diamants',desc:'+20 % de diamants sur les paris placés ce soir',dia:1.2,fin:+new Date(d.getFullYear(),d.getMonth(),d.getDate(),23,59,59)});
  for(const e of EVX){const a=Date.parse(e.debut),b=Date.parse(e.fin);if(a<=Date.now()&&Date.now()<b)L.push({...e,fin:b})}
  return L}
const evVal=k=>events().reduce((m,e)=>Math.max(m,Number(e[k])||1),1);
function leftTxt(ms){ms=Math.max(0,ms);const j=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);return j?j+' j '+h+' h':h?h+' h '+m+' min':m+' min'}
function eventBanner(){const L=events();if(!L.length)return '';
  return L.map(e=>'<div class="ev-ban"><span class="ev-ic">'+(e.ic||'🎉')+'</span><span class="ev-t"><b>'+esc(e.nom)+'</b><span>'+esc(e.desc||'')+' · encore '+leftTxt(e.fin-Date.now())+'</span></span></div>').join('')}

const XPV={bet:10,win:25,bigwin:25,game:3,gamewin:3,poker:40,chest:10,wheel:10,cal:15,gift:10,share:15,friend:20,duel:20,mission:50};
const lvNeed=L=>100+50*(L-1);
function lvInfo(xp){let L=1,x=Math.max(0,xp||0);while(x>=lvNeed(L)&&L<999){x-=lvNeed(L);L++}return{L,cur:x,need:lvNeed(L)}}
const lvRw=L=>L%5===0?{c:500,d:2000}:{c:300};
function addXp(n){if(!session||!n)return;const b=lvInfo(state.xp).L;state.xp=(state.xp||0)+Math.round(n*evVal('xp'));const a=lvInfo(state.xp).L;state.lv=a;
  if(a>b){const R={c:0,d:0};for(let L=b+1;L<=a;L++){const r=lvRw(L);R.c+=r.c||0;R.d+=r.d||0}giveRw(R);
    setTimeout(()=>{celebrate('⭐','Niveau '+a+' !','Bravo, tu passes au <b>niveau '+a+'</b>.<br>Récompense : <b>'+rwTxt(R)+'</b>');winFx('fx-gold')},400);checkBadges()}}

const missList=()=>shuffleBy(MISS,hstr(weekId()+'pc')).slice(0,5);

  const before=M.p[m.id]||0;if(before>=m.n)continue;M.p[m.id]=before+1;if(M.p[m.id]>=m.n)setTimeout(()=>toast('🎯 Mission réussie : '+m.t+' — récupère ta récompense !'),900)}}
function missReady(){const M=missWeek();return missList().filter(m=>(M.p[m.id]||0)>=m.n&&!M.c.includes(m.id)).length}
function missClaim(id){const M=missWeek(),m=missList().find(x=>x.id===id);if(!m||M.c.includes(id)||(M.p[id]||0)<m.n)return;
  M.c.push(id);giveRw(m.rw);addXp(XPV.mission);bjSnd('win');winFx('fx-confetti');toast('🎁 '+rwTxt(m.rw)+' récupérés !');

/* ---- Point d'entrée : chaque action du joueur ---- */
function track(ev,d){if(!session)return;d=d||{};
  const x={bet:XPV.bet,win:XPV.win+(d.odds>=3?XPV.bigwin:0),game:XPV.game+(d.win?XPV.gamewin:0),poker:XPV.poker,chest:XPV.chest,wheel:XPV.wheel,cal:XPV.cal,gift:XPV.gift,share:XPV.share,friend:XPV.friend,duel:XPV.duel}[ev]||0;
  missProgress(ev,d);
  if(ev==='bet')unlockBadge('bet1');
  if(ev==='win'){unlockBadge('win1');if(d.n>=2)unlockBadge('combi');if(d.n>=5)unlockBadge('combi5');if(d.odds>=10)unlockBadge('odds10')}
  if(ev==='poker')unlockBadge('poker');if(ev==='duelwin')unlockBadge('duel');
  if(ev==='share')state.shareDay=today();
  addXp(x);checkBadges();save()}
function scanBets(){if(!session)return;
  if(!state.xpInit){state.xpInit=1;state.xp=Math.max(state.xp||0,(state.bets||[]).length*XPV.bet+((state.stats&&state.stats.won)||0)*XPV.win);state.lv=lvInfo(state.xp).L;
    for(const b of state.bets){b.xa=1;if(b.status==='won')b.xw=1}save();return}
  if(!state.month||state.month.id!==monthId())state.month={id:monthId(),earned:0};
  for(const b of state.bets){const sp=[...new Set((b.sels||[]).map(s=>s.sp||((findMatch(s.matchId)||{}).sp)).filter(Boolean))];
    if(!b.xa){b.xa=1;track('bet',{sp,n:(b.sels||[]).length})}
    if(b.status==='won'&&!b.xw){b.xw=1;track('win',{sp,n:(b.sels||[]).length,odds:b.odds,payout:b.payout})}}
  if(!ui.bdChk){ui.bdChk=1;checkBadges()}}

function bjSettle(res,why){
  const b=bjS(),c=b.cur;if(!c||c.st==='done')return;
  c.st='done';c.res=res;c.why=why||'';
  const T=state.bjt=state.bjt||{n:0,w:0,l:0,p:0};T.n++;if(res==='win'||res==='bj')T.w++;else if(res==='push')T.p++;else T.l++;
  if(res==='win'||res==='bj'){state.coins+=c.bet*2;b.w=(b.w||0)+1}
  else if(res==='push')state.coins+=c.bet;
  else b.l=(b.l||0)+1;
  b.bet=Math.min(Math.max(c.bet/(c.dbl?2:1),BJ_MIN),BJ_MAX);
  bjFx=res;bjSnd(res);if(res==='win'||res==='bj')winFx();track('game',{g:'bj',win:res==='win'||res==='bj'});if(res==='bj')unlockBadge('bj21');try{if(navigator.vibrate)navigator.vibrate(res==='lose'?[60,40,60]:res==='push'?20:[30,30,30,30,120])}catch(e){}
  save();bjBusy=false;bjRender();
}
function bjDealer(){
  if(!bjS().cur)return;bjBusy=true;
  const step=()=>{const cur=bjS().cur;if(!cur||cur.st!=='dealer')return;
    if(bjVal(cur.d)<17){cur.d.push(bjCard());save();bjRender();setTimeout(step,850);return}
    const p=bjVal(cur.p),d=bjVal(cur.d);
    setTimeout(()=>bjSettle(d>21||p>d?'win':p===d?'push':'lose'),500)};
  setTimeout(step,900);
}
function bjAction(a){
  const b=bjS();
  if(a==='deal'){
    if(!session){ui.authMode='signup';openAuth('Créez un compte gratuit pour jouer au blackjack.');return}
    if(bjBusy)return;
    const bet=bjBet();
    if(state.coins<bet){toast('Pas assez de pièces');return}
    state.coins-=bet;b.n=(b.n||0)+1;b.bet=bet;bjSeen=new Set();bjReveal=false;bjFx='';
    b.cur={bet,dbl:false,st:'play',p:[bjCard(),bjCard()],d:[bjCard(),bjCard()]};
    save();bjBusy=true;bjSnd('chip');bjRender();
    const w=document.querySelector('.bj-wrap');if(w&&w.scrollIntoView)try{w.scrollIntoView({behavior:'smooth',block:'start'})}catch(e){}
    setTimeout(()=>{bjBusy=false;const c=bjS().cur;if(!c)return;
      const pb=bjIsBJ(c.p),db=bjIsBJ(c.d);
      if(pb||db){bjBusy=true;c.st='dealer';bjReveal=true;bjRender();setTimeout(()=>bjSettle(pb&&db?'push':pb?'bj':'lose'),900);return}
      bjRender()},1500);
    return}
  const c=b.cur;if(!c||c.st!=='play'||bjBusy)return;
  const bust=()=>setTimeout(()=>{c.st='dealer';bjReveal=true;bjRender();setTimeout(()=>bjSettle('lose','bust'),700)},750);
  if(a==='hit'){c.p.push(bjCard());save();
    const v=bjVal(c.p);
    if(v>21){bjBusy=true;bjRender();bust();return}
    if(v===21){bjBusy=true;bjRender();setTimeout(()=>{bjBusy=false;bjAction('stand')},750);return}
    bjRender();return}
  if(a==='double'){if(c.p.length!==2||state.coins<c.bet)return;
    state.coins-=c.bet;c.bet*=2;c.dbl=true;c.p.push(bjCard());save();bjBusy=true;bjSnd('chip');bjRender();
    if(bjVal(c.p)>21)bust();else setTimeout(()=>{bjBusy=false;bjAction('stand')},850);return}
  if(a==='stand'){c.st='dealer';bjReveal=true;save();bjRender();bjDealer()}
}

  if(t.id==='installHide'){lsSet('pc_inst_hide','1');renderView();return}
  if(t.id==='installBtn'){
    if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;renderView()})}
    else iosHelp();
    return}
  if(!session&&(d.buy||d.defi||t.id==='place')){ui.authMode='signup';$('#aside').classList.remove('open');openAuth(t.id==='place'?'Créez votre compte gratuit pour valider ce pari : votre coupon est gardé.':'Créez un compte gratuit (ou connectez-vous) pour jouer.');return}
  if(session&&!synced&&(d.sel||d.buy||d.equip||d.defi||t.id==='place')){toast('⏳ Chargement de votre compte…');refreshFromServer();return}
  if(d.defi){const[id,mk,opt]=d.defi.split('|'),m=findMatch(id);if(!m||status(m)!=='avenir'||defiToday())return;
    state.defis=(state.defis||[]).concat([{day:today(),matchId:id,mk,opt,status:'pending'}]).slice(-20);save();renderView();toast('🎯 Réponse enregistrée ! Résultat après le match.');return}
  if(d.sel){const[id,mk,opt]=d.sel.split('|');toggleSel(id,mk,opt);return}
  if(d.open){ui.open=ui.open===d.open?null:d.open;renderView();return}
  if(d.go){ui.tab='matchs';ui.sport=d.go;ui.comp='all';renderHeader();renderView();toTop();return}
  if(d.social){ui.social=d.social;if(d.social==='board')loadBoard();if(d.social==='ligues'){ui.ligue=null;loadLigues()}if(d.social==='amis')loadAmis();renderView();if(d.social==='chat')chatSoon();return}
  if(d.sport){ui.sport=d.sport;ui.open=null;ui.comp='all';renderView();return}
  if(d.comp){ui.comp=d.comp;renderView();return}
  if(d.bf){ui.betFilter=d.bf;renderView();return}
  if(d.rm){ui.slip=ui.slip.filter(s=>selKey(s)!==d.rm);if(ui.slip.length<2&&ui.mode==='combi')ui.mode='simple';renderSlip();renderView();return}
  if(d.mode){ui.mode=d.mode;renderSlip();return}
  if(d.lsp){ui.lsp=d.lsp;renderView();return}
  if(d.pay){ui.pay=d.pay==='c'?'c':'d';lsSet('pc_pay',ui.pay);renderSlip();return}
  if(d.qs){const v=d.v==='max'?state.coins:+d.v;if(d.qs==='__combi')ui.combi=v;else ui.stakes[d.qs]=v;renderSlip();return}
  if(t.id==='place'){placeBets();return}
  if(t.id==='closeSlip'){$('#aside').classList.remove('open');return}
  if(t.id==='fab'||t.id==='bnSlip'){$('#aside').classList.add('open');return}
  if(d.buy){
    const i=SHOP.find(x=>x.id===d.buy);if(!i||i.hidden||(i.cur==='c'?state.coins:state.diamonds)<i.cost||(i.limited&&!limNow().includes(i.id))||(EQUIP[i.kind]&&state.owned.includes(i.id)))return;
    if(i.cur==='c')state.coins-=i.cost;else{state.diamonds-=i.cost;state.spent=(state.spent||0)+i.cost}
    if(i.kind==='coins'){state.coins+=i.val;toast('🪙 +'+nf(i.val)+' pièces ajoutées')}
    else if(i.kind==='inv'){state.inv[i.id]=(state.inv[i.id]||0)+1;toast(i.ic+' '+i.name+(i.id==='spin'?' : va sur la roue pour l\'utiliser':i.id==='chestx'?' : va sur le coffre pour l\'ouvrir':' : disponible dans votre coupon'))}
    else if(i.kind==='vip'){buyVip()}
    else if(i.kind==='mystery'){save();openMystery();renderAll();return}
    else{state.owned.push(i.id);state[EQUIP[i.kind]]=eqVal(i);toast(i.ic+' '+i.name+' débloqué !');if(i.kind==='fx')winFx(i.cls)}
    save();renderAll();return;
  }
  if(d.equip){
    const i=SHOP.find(x=>x.id===d.equip);
    const f=EQUIP[i.kind];state[f]=state[f]===eqVal(i)?null:eqVal(i);
    save();renderAll();return;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(profOpen||mp.open)){ovBack();return}if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.prof)openProfil(e.target.dataset.prof)});
document.getElementById('popModal').addEventListener('click',e=>{if(e.target.id==='popModal')closePop()});
document.addEventListener('change',e=>{
  if(e.target.dataset&&e.target.dataset.npref&&ui.notif&&ui.notif.prefs){ui.notif.prefs[e.target.dataset.npref]=e.target.checked;if(ui.notif.on)notifSave();return}const d=e.target.dataset;if(d.ex){ui[d.ex]=e.target.checked;renderSlip()}});
document.addEventListener('input',e=>{
  const d=e.target.dataset;
  if(d.stake!==undefined){const v=e.target.value;if(d.stake==='__combi')ui.combi=v;else ui.stakes[d.stake]=v;refreshSlipNumbers()}
});

/* ---------- Écran de chargement ---------- */
function splashReady(){if(!window.hideSplash)return;if(!session||synced){window.hideSplash();return}const t=setInterval(()=>{if(!session||synced){clearInterval(t);window.hideSplash()}},200);setTimeout(()=>clearInterval(t),5000)}
/* ---------- Boucle ---------- */
function tick(force){
  const a=daily(),b=settle();
  if(a||b)save();
  try{scanBets()}catch(e){}
  renderHeader();
  const focused=(document.activeElement&&document.activeElement.matches('input'))||(ui.tab==='chat'&&ui.social==='chat');
  if(!focused){renderView();renderSlip()}
}
tick(true);
loadFixtures();loadEvents();
setInterval(()=>tick(false),20000);
setInterval(loadFixtures,3*60*1000);
if(session)refreshFromServer();
else if(!lsGet('pc_welcome')){lsSet('pc_welcome','1');const par=lsGet('pc_parrain');
  popup('<div class="pop-ic big">⚽</div><h3>Bienvenue sur PronoClub</h3><p>Pariez <b>gratuitement</b> sur les vrais matchs : foot, basket, tennis, hockey… <b>'+nf(DAILY)+' pièces offertes chaque jour</b>, des diamants à gagner et des défis entre amis.'+(par?'<br><br>🎁 <b>'+esc(par)+'</b> vous offre <b>'+nf(PARRAIN_BONUS)+' pièces</b> à l\'inscription !':'')+'</p><div class="pop-btns"><button class="pbtn" data-auth="signup">Créer mon compte</button><button class="pbtn ghost2" data-popclose="1">Visiter d\'abord</button></div>')}
chatSoon();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){loadFixtures();refreshFromServer()}});
</script>
</body>
