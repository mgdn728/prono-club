<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PronoClub — Paris sportifs gratuits</title>
<meta name="theme-color" content="#e5126b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PronoClub">
<meta name="description" content="Paris sportifs gratuits sur les vrais matchs : 1 000 pièces par jour, des diamants à gagner et un classement entre amis.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e13;--panel:#111821;--card:#161f2a;--card2:#1c2734;--line:#253244;
  --text:#e9eff6;--muted:#8796a8;--acc:#1fd47e;--acc-ink:#04130b;--coin:#f6c445;--dia:#62c6ff;--bad:#ff5d6c;
  --r:14px;
}
body.theme-gold{--acc:#f2b632;--acc-ink:#1a1200}
body.theme-purple{--acc:#a983ff;--acc-ink:#12082a}
body.theme-red{--acc:#ff5a5f;--acc-ink:#220405}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:15px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed}
input{font:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}

/* header */
header{padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:20;background:rgba(10,14,19,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:14px;height:62px}
.brand{font-weight:800;font-size:20px;letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
.brand i{font-style:normal;display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--acc);color:var(--acc-ink);font-size:17px}
.brand span{color:var(--acc)}
.title-chip{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;border:1px solid var(--acc);color:var(--acc);white-space:nowrap}
.bal{margin-left:auto;display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);padding:7px 12px;border-radius:99px;font-weight:700;white-space:nowrap}
.pill.coin b{color:var(--coin)} .pill.dia b{color:var(--dia)}
.pill small{color:var(--muted);font-weight:500}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{padding:11px 14px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:var(--text);border-color:var(--acc)}
nav .badge{background:var(--acc);color:var(--acc-ink);border-radius:99px;font-size:11px;padding:1px 6px;margin-left:4px}

/* layout */
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;padding:20px 0 120px}
.reset-note{color:var(--muted);font-size:13px;margin:0 0 14px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{padding:7px 12px;border-radius:8px;color:var(--muted);font-weight:600;font-size:14px}
.seg button.on{background:var(--card2);color:var(--text)}
.chip{padding:7px 12px;border-radius:99px;border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:13px;background:var(--panel)}
.chip.on{border-color:var(--acc);color:var(--text);background:color-mix(in srgb,var(--acc) 14%,transparent)}

/* match */
.match{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.mrow{display:grid;grid-template-columns:1fr auto;gap:14px;padding:14px;align-items:center}
.mmeta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:8px}
.st{font-weight:700;padding:2px 7px;border-radius:6px;background:var(--card2);color:var(--text)}
.st.live{background:var(--bad);color:#fff}
.st.done{background:transparent;border:1px solid var(--line);color:var(--muted)}
.teams{display:grid;gap:4px;font-weight:600}
.teams div{display:flex;justify-content:space-between;gap:10px}
.teams .sc{font-weight:800;min-width:18px;text-align:right}
.teams .win{color:var(--acc)}
.quick{display:grid;grid-template-columns:repeat(3,78px);gap:6px}
.odd{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 6px;min-height:50px;transition:.12s}
.odd span{font-size:11px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.odd b{font-size:15px}
.odd:hover:not(:disabled){border-color:var(--acc)}
.odd.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.odd.on span{color:var(--acc-ink)}
.odd:disabled{opacity:.4}
.odd.wonopt{border-color:var(--acc);opacity:1}
.mfoot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:8px 14px}
.link{color:var(--acc);font-weight:600;font-size:13px;padding:4px 0}
.ghost{font-size:12px;color:var(--muted);font-weight:600;padding:5px 9px;border:1px dashed var(--line);border-radius:8px}
.ghost:hover{color:var(--text);border-color:var(--muted)}
.markets{border-top:1px solid var(--line);padding:6px 14px 14px;background:color-mix(in srgb,var(--panel) 60%,var(--bg))}
.mk{margin-top:12px}
.mk h4{margin:0 0 7px;font-size:13px;color:var(--muted);font-weight:600}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px}
.opts.cs{grid-template-columns:repeat(auto-fill,minmax(72px,1fr))}

/* slip */
aside{position:sticky;top:120px;align-self:start}
.slip{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.slip-h{display:flex;align-items:center;justify-content:space-between;padding:14px;border-bottom:1px solid var(--line);font-weight:800}
.slip-h .x{display:none;font-size:22px;color:var(--muted)}
.slip-b{padding:12px 14px;max-height:calc(100vh - 330px);overflow:auto}
.empty{color:var(--muted);text-align:center;padding:28px 10px;font-size:14px;line-height:1.5}
.sel{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 11px;margin-bottom:8px}
.sel .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.sel .pick{font-weight:700}
.sel .sub{font-size:12px;color:var(--muted);margin-top:2px}
.sel .o{font-weight:800;color:var(--acc)}
.sel .rm{color:var(--muted);font-size:18px;line-height:1;margin-left:6px}
.stake{display:flex;align-items:center;gap:8px;margin-top:8px}
.stake input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 10px;font-weight:700}
.stake input:focus{outline:none;border-color:var(--acc)}
.stake .g{font-size:12px;color:var(--muted);white-space:nowrap}
.quickstake{display:flex;gap:5px;margin-top:7px}
.quickstake button{flex:1;font-size:12px;font-weight:700;padding:5px 0;border-radius:7px;background:var(--card2);color:var(--muted)}
.quickstake button:hover{color:var(--text)}
.slip-f{border-top:1px solid var(--line);padding:12px 14px}
.row{display:flex;justify-content:space-between;font-size:14px;margin:4px 0}
.row .v{font-weight:700}
.row.big .v{color:var(--dia);font-size:17px}
.extras{display:grid;gap:6px;margin:8px 0}
.extras label{display:flex;gap:8px;align-items:center;font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 9px;cursor:pointer}
.extras label.off{opacity:.45;cursor:not-allowed}
.btn{width:100%;background:var(--acc);color:var(--acc-ink);font-weight:800;padding:13px;border-radius:11px;font-size:15px;margin-top:8px}
.btn:disabled{opacity:.45}
.err{color:var(--bad);font-size:13px;margin-top:6px;min-height:1px}
.fab{display:none}

/* bets & shop */
.h2{font-size:20px;font-weight:800;margin:0 0 4px}
.sub2{color:var(--muted);margin:0 0 16px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat small{color:var(--muted);font-size:12px}
.stat b{display:block;font-size:20px;margin-top:3px}
.bet{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.bet .bh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.tag{font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px}
.tag.pending{background:var(--card2);color:var(--muted)}
.tag.won{background:color-mix(in srgb,var(--acc) 20%,transparent);color:var(--acc)}
.tag.lost{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.bl{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0;border-top:1px dashed var(--line)}
.bl:first-of-type{border-top:0}
.bl .s{color:var(--muted);font-size:12px}
.mark{font-weight:800}
.mark.ok{color:var(--acc)} .mark.ko{color:var(--bad)}
.bf{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--muted)}
.bf b{color:var(--text)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.item .ic{font-size:30px}
.item h3{margin:0;font-size:16px}
.item p{margin:0;color:var(--muted);font-size:13px;line-height:1.45;flex:1}
.item .cost{font-weight:800;color:var(--dia)}
.item button{background:var(--card2);border:1px solid var(--line);padding:10px;border-radius:10px;font-weight:700}
.item button.buy{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.item button:disabled{opacity:.45}
.item .own{font-size:12px;color:var(--acc);font-weight:700}
.sec{font-size:14px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:22px 0 10px}
.rules{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;line-height:1.6}
.rules h3{margin:18px 0 6px}
.rules h3:first-child{margin-top:0}
.rules ul{margin:0;padding-left:20px}
.disc{color:var(--muted);font-size:13px;margin-top:18px;border-top:1px solid var(--line);padding-top:14px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);opacity:0;background:var(--card2);border:1px solid var(--line);padding:12px 18px;border-radius:12px;font-weight:700;z-index:60;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:900px){
  main{grid-template-columns:1fr}
  aside{position:fixed;inset:auto 0 0 0;top:auto;z-index:50;transform:translateY(105%);transition:.25s}
  aside.open{transform:none}
  .slip{border-radius:18px 18px 0 0;max-height:85vh;display:flex;flex-direction:column}
  .slip-b{max-height:none;flex:1}
  .slip-h .x{display:block}
  .fab{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;background:var(--acc);color:var(--acc-ink);border-radius:14px;padding:14px 16px;font-weight:800;justify-content:space-between;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .fab.hide{display:none}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:560px){
  .hbar{gap:8px}
  .brand{font-size:17px}
  .title-chip{display:none}
  .pill{padding:6px 9px;font-size:14px}
  .pill small{display:none}
  .mrow{grid-template-columns:1fr}
  .quick{grid-template-columns:repeat(3,1fr)}
}

/* comptes */
.pill.user{cursor:pointer;color:var(--text)}
.pill.user:hover{border-color:var(--acc)}
.modal{position:fixed;inset:0;z-index:80;background:rgba(5,8,12,.82);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.auth{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px}
.auth .brand{justify-content:center;font-size:24px;margin-bottom:6px}
.auth p.lead{text-align:center;color:var(--muted);margin:0 0 18px;font-size:14px;line-height:1.5}
.auth .seg{margin-bottom:16px}
.auth .seg button{flex:1}
.auth label{display:block;font-size:13px;color:var(--muted);font-weight:600;margin:10px 0 5px}
.auth input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 12px;font-size:15px}
.auth input:focus{outline:none;border-color:var(--acc)}
.auth .hint{font-size:12px;color:var(--muted);margin-top:5px}
.auth .err{text-align:center;margin-top:10px}
.auth .menu{display:grid;gap:8px;margin-top:8px}
.auth .menu button{background:var(--card2);border:1px solid var(--line);padding:11px;border-radius:10px;font-weight:700}
.board{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.brow{display:grid;grid-template-columns:44px 1fr auto auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.brow:first-child{border-top:0}
.brow .rk{font-weight:800;color:var(--muted);text-align:center}
.brow.me{background:color-mix(in srgb,var(--acc) 12%,transparent)}
.brow .d{font-weight:800;color:var(--dia)}
.brow .w{color:var(--muted);font-size:13px}
.install{display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--acc) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--acc) 45%,var(--line));border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.install img{width:40px;height:40px;border-radius:10px}
.install div{flex:1;font-size:14px;line-height:1.4}
.install .go{background:var(--acc);color:var(--acc-ink);font-weight:800;padding:9px 14px;border-radius:10px;white-space:nowrap}
.install .no{color:var(--muted);font-size:20px;padding:0 4px}
.ios-steps{text-align:left;line-height:1.7;margin:0 0 14px;padding-left:20px}

/* ===== Thème « rouge sport » ===== */
:root{
  --bg:#eef0f4;--panel:#ffffff;--card:#f3f4f7;--card2:#e7e9ee;--line:#dde1e8;
  --text:#121722;--muted:#687285;--acc:#e0182d;--acc-ink:#ffffff;--coin:#c88a00;--dia:#1a73d9;--bad:#e0182d;
  --head:#161b26;--head2:#202736;--good:#14a05a;
}
body.theme-gold{--acc:#d99a00;--acc-ink:#1a1200}
body.theme-purple{--acc:#7b3fe4;--acc-ink:#fff}
body.theme-red{--acc:#b30f22;--acc-ink:#fff}
header{background:var(--head);border-bottom:0;box-shadow:0 2px 0 var(--acc)}
header .brand,header .pill{color:#fff}
header .brand span{color:var(--acc)}
.brand i{background:var(--acc);color:#fff}
header .pill,header .pill.user{background:var(--head2);border-color:#2c3446;color:#fff}
header .pill.coin b{color:#ffc93c} header .pill.dia b{color:#6cc0ff}
header .pill small{color:#9aa4b8}
header .title-chip{border-color:#fff;color:#fff}
nav#nav button{color:#a8b1c3}
nav#nav button.on{color:#fff;border-color:var(--acc)}
.modal{background:rgba(18,23,34,.7)}
.auth .brand{color:var(--text)}
.toast{background:var(--head);color:#fff;border-color:var(--head)}
.hero{background:linear-gradient(110deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#5a0010));color:#fff;border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.hero b{display:block;font-size:17px}
.hero span{font-size:13px;opacity:.9}
.toolbar{gap:10px}
.chips-m{display:none;gap:8px;overflow-x:auto;width:100%;padding-bottom:2px}
.chips-m .chip{white-space:nowrap}
.mlayout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:16px;align-items:start}
.side{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px;position:sticky;top:120px}
.side-h{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 10px}
.side button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;padding:9px 10px;border-radius:9px;font-weight:600;font-size:14px}
.side button:hover{background:var(--card)}
.side button.on{background:color-mix(in srgb,var(--acc) 10%,transparent);color:var(--acc)}
.side small{background:var(--card2);color:var(--muted);border-radius:99px;padding:1px 7px;font-size:11px;font-weight:700}
.grp{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.grp-h{display:grid;grid-template-columns:minmax(0,1fr) 258px 44px;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line);font-weight:800;font-size:14px}
.grp-h .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;color:var(--muted);font-size:12px}
.grp-h .cols i{font-style:normal}
.mrow2{display:grid;grid-template-columns:58px minmax(0,1fr) 258px 44px;gap:8px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.grp .mrow2:nth-child(2){border-top:0}
.mrow2.open{background:color-mix(in srgb,var(--acc) 4%,transparent)}
.when{font-size:12px;text-align:center;line-height:1.25}
.when .st{background:transparent;color:var(--text);font-weight:700;padding:0}
.when .st.live{background:var(--acc);color:#fff;padding:2px 6px;border-radius:5px}
.when .st.done{border:0;color:var(--muted);font-size:11px}
.tm{display:grid;gap:3px;text-align:left;min-width:0;font-weight:600;font-size:14px}
.tm span{display:flex;justify-content:space-between;gap:8px}
.tm i{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm .sc{min-width:16px;text-align:right}
.tm .sc.win{color:var(--acc)}
.tm em{font-style:normal;font-size:11px;color:var(--acc);font-weight:700}
.tm:hover i{color:var(--acc)}
.q3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.odd{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:44px;padding:5px 4px}
.q3 .odd span{display:none}
.odd b{font-size:15px;color:var(--text)}
.odd:hover:not(:disabled){border-color:var(--acc);background:#fff}
.odd.on{background:var(--acc);border-color:var(--acc)}
.odd.on b,.odd.on span{color:#fff}
.odd.wonopt{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.more{height:44px;border-radius:8px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:800;color:var(--muted)}
.more:hover{color:var(--acc);border-color:var(--acc)}
.markets{background:var(--card);border-top:1px solid var(--line)}
.opts .odd span{display:block}
.slip{box-shadow:0 6px 24px rgba(18,23,34,.08)}
.slip-h{background:var(--head);color:#fff;border-bottom:0}
.slip-h .x{color:#fff}
.sel .o{color:var(--acc)}
.btn{background:var(--acc);color:#fff}
.row.big .v{color:var(--dia)}
.tag.won{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.mark.ok{color:var(--good)}
.chip.on{border-color:var(--acc);color:var(--acc);background:color-mix(in srgb,var(--acc) 8%,#fff)}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg{background:var(--card2)}
.fab{background:var(--acc);color:#fff}
.item button.buy{color:#fff}
.install .go{color:#fff}
@media (max-width:900px){main{grid-template-columns:minmax(0,1fr)}}
.odd.on,.odd.on:hover:not(:disabled){background:var(--acc);border-color:var(--acc)}
.odd.on:hover b{color:#fff}
@media (max-width:1100px){.mlayout{grid-template-columns:minmax(0,1fr)}.side{display:none}.chips-m{display:flex}}
@media (max-width:560px){

/* ===== Cartes de match aérées + onglets par sport ===== */
.sports{display:flex;gap:8px;overflow-x:auto;margin:0 -2px 14px;padding:2px 2px 4px;scrollbar-width:none}
.sports::-webkit-scrollbar{display:none}
.sports button{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:11px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:15px;box-shadow:0 1px 2px rgba(18,23,34,.05)}
.sports .si{font-size:18px}
.sports small{background:var(--card2);color:var(--muted);border-radius:99px;padding:1px 8px;font-size:11px;font-weight:800}
.sports button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.sports button.on small{background:rgba(255,255,255,.25);color:#fff}
.comps{display:flex;gap:8px;overflow-x:auto;margin-bottom:4px;padding-bottom:4px;scrollbar-width:none}
.comps::-webkit-scrollbar{display:none}
.comps .chip{white-space:nowrap;flex:0 0 auto}
.day{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:20px 4px 10px}
.mc{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(18,23,34,.05)}
.mc.open{border-color:color-mix(in srgb,var(--acc) 40%,var(--line))}
.mc-h{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:10px}
.mc-h .st{font-weight:700;color:var(--text);background:none;padding:0;border:0}
.mc-h .st.live{color:var(--acc)}
.mc-h .st.done{color:var(--muted)}
.mc-b{margin-left:auto;color:var(--acc);font-weight:700}
.mc-t{display:grid;gap:7px;width:100%;text-align:left;font-size:16px;font-weight:700;margin-bottom:14px}
.mc-t span{display:flex;justify-content:space-between;gap:10px}
.mc-t i{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc-t .sc{font-size:17px}
.mc-t .sc.win{color:var(--acc)}

.mc-o{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mc-o.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.mc-o .odd{flex-direction:row;justify-content:space-between;align-items:center;padding:0 14px;min-height:50px;border-radius:12px}
.mc-o .odd span{display:block;font-size:13px;color:var(--muted);font-weight:800}
.mc-o .odd b{font-size:16px}
.mc-o .odd.on span{color:#fff}
.mc-m{display:block;width:100%;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;font-weight:700;color:var(--acc);text-align:center}
.mc .markets{margin:12px -16px -14px;padding:2px 16px 16px;border-radius:0 0 16px 16px}
.mc .markets .mk h4{color:var(--text);font-size:13.5px}
.opts{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.opts .odd{min-height:52px;border-radius:10px}
.opts .odd span{font-size:12px;white-space:normal;text-align:center;line-height:1.25}
.hero{display:flex;flex-direction:column;gap:2px}
@media (max-width:420px){
  .mc{padding:12px 13px}

  .mc-o .odd b{font-size:15px}
  .sports button{padding:10px 13px;font-size:14px}
}

/* ===== Interface « pro » colorée ===== */
:root{--bg:#edf0f5;--head:#0f1624;--head2:#1c2436}
body{background:linear-gradient(180deg,#e3e8f1 0,#edf0f5 260px) fixed}
header{background:linear-gradient(100deg,#0f1624 0%,#1a2236 60%,#2a1220 100%);box-shadow:0 3px 0 var(--acc),0 8px 24px rgba(15,22,36,.25)}
.brand{letter-spacing:-.6px}
.brand i{background:linear-gradient(135deg,#ff3b4d,#b3001b);box-shadow:0 4px 12px rgba(224,24,45,.45)}
header .pill{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12);backdrop-filter:blur(4px)}
/* onglets de sport */
.sports button{gap:9px;padding:8px 14px 8px 8px;border-radius:999px;border-color:transparent;background:#fff;box-shadow:0 2px 6px rgba(15,22,36,.07)}
.sports .si{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:color-mix(in srgb,var(--sc) 16%,#fff);font-size:17px}

.sports button.on .si{background:rgba(255,255,255,.22)}
/* bannière */
.hero{position:relative;overflow:hidden;background:radial-gradient(circle at 92% 20%,rgba(255,214,90,.55) 0,transparent 32%),radial-gradient(circle at 75% 120%,rgba(255,255,255,.18) 0,transparent 40%),linear-gradient(115deg,#e0182d 0%,#b5102a 55%,#6d0a2c 100%);padding:18px 20px;border-radius:18px;box-shadow:0 10px 24px rgba(224,24,45,.25)}
.hero::after{content:"🪙";position:absolute;right:18px;top:50%;transform:translateY(-50%) rotate(-12deg);font-size:46px;opacity:.9;filter:drop-shadow(0 4px 8px rgba(0,0,0,.25))}
.hero b{font-size:18px;padding-right:56px}
.hero span{padding-right:56px}
/* à la une */
.feat-h{display:flex;align-items:baseline;gap:10px;margin:4px 4px 10px}
.feat-h b{font-size:17px}
.feat-h span{font-size:12.5px;color:var(--muted)}
.feat{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 14px;margin:0 -2px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.feat::-webkit-scrollbar{display:none}
.fc{flex:0 0 268px;scroll-snap-align:start;border-radius:18px;padding:14px;color:#fff;background:radial-gradient(circle at 100% 0,rgba(255,255,255,.22) 0,transparent 45%),linear-gradient(140deg,var(--sc) 0%,color-mix(in srgb,var(--sc) 55%,#0f1624) 100%);box-shadow:0 10px 22px color-mix(in srgb,var(--sc) 30%,transparent)}
.fc-h{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;font-weight:700;opacity:.92;margin-bottom:10px}
.fc-h span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc-t{display:flex;align-items:center;gap:9px;margin:6px 0;font-size:15px}
.fc-t b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc-t .av{box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.fc-o{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.fc-o.two{grid-template-columns:repeat(2,1fr)}
.fc .odd{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.25);min-height:44px;flex-direction:row;justify-content:space-between;padding:0 10px;border-radius:10px}
.fc .odd span{display:block;color:rgba(255,255,255,.8);font-size:12px;font-weight:800}
.fc .odd b{color:#fff;font-size:15px}
.fc .odd:hover:not(:disabled){background:rgba(255,255,255,.28);border-color:#fff}
.fc .odd.on,.fc .odd.on:hover:not(:disabled){background:#fff;border-color:#fff}
.fc .odd.on b,.fc .odd.on span{color:var(--sc)}
/* avatars d'équipe */
.av{flex:0 0 auto;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-size:11px;font-weight:800;letter-spacing:-.3px;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 70% 52%),hsl(calc(var(--h) + 30) 70% 38%))}
/* cartes de match */
.mc{position:relative;border:0;border-radius:18px;padding:14px 16px 12px 20px;box-shadow:0 2px 10px rgba(15,22,36,.06)}
.mc::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--sc)}

.mc-c{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--sc) 12%,#fff);color:color-mix(in srgb,var(--sc) 75%,#0f1624);font-weight:700}
.mc-h .st{font-size:12.5px}
.mc-h .st.live{display:inline-flex;align-items:center;gap:6px;color:#fff;background:var(--acc);padding:3px 9px;border-radius:999px;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(224,24,45,.5)}50%{box-shadow:0 0 0 6px rgba(224,24,45,0)}}
.mc-t span{align-items:center;justify-content:flex-start}
.mc-t i{flex:1}
.mc-o .odd{background:#f5f7fa;border-color:#e3e7ee}
.mc-o .odd:hover:not(:disabled){background:#fff;border-color:var(--acc);box-shadow:0 3px 10px rgba(224,24,45,.12)}
.odd.on,.odd.on:hover:not(:disabled){background:linear-gradient(135deg,#ff2a3f,#c50f25)!important;border-color:#c50f25!important;box-shadow:0 4px 12px rgba(224,24,45,.35)}
.mc-m{color:color-mix(in srgb,var(--acc) 85%,#000)}
.day{display:flex;align-items:center;gap:10px}
.day::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#cfd6e2,transparent)}
.chip{background:#fff;border-color:transparent;box-shadow:0 1px 4px rgba(15,22,36,.07);color:#3a4354}
.chip.on{background:var(--head);color:#fff;border-color:var(--head)}
/* coupon */
.slip{border:0;border-radius:18px;box-shadow:0 10px 30px rgba(15,22,36,.12)}
.slip-h{background:linear-gradient(110deg,#0f1624,#2a1220)}

/* barre de navigation du bas (mobile) */
.bnav{display:none}

/* ===== Thème 2026 : des couleurs partout ===== */
:root{
  --red:#ff1f3d;--pink:#e5126b;--violet:#6a2cf5;--indigo:#3b1fa8;--orange:#ff7a1a;--yellow:#ffc21a;--teal:#00c2a8;--blue:#1f7bff;--green:#18b85c;--ink:#0d1220;
  --grad-main:linear-gradient(120deg,#ff1f3d 0%,#e5126b 48%,#6a2cf5 100%);
  --acc:#e8143a;--bg:#f3f4f9;--line:#e4e7ef;--muted:#6b7385;--dia:#1f6fe0;
  --sh:0 4px 14px rgba(13,18,32,.07);--sh2:0 12px 28px rgba(13,18,32,.14);
}
body.theme-gold{--grad-main:linear-gradient(120deg,#ffb000 0%,#ff7a1a 55%,#c2410c 100%);--acc:#e07a00}
body.theme-purple{--grad-main:linear-gradient(120deg,#a855f7 0%,#6a2cf5 50%,#2b0f8a 100%);--acc:#7c3aed}
body.theme-red{--grad-main:linear-gradient(120deg,#ff2d2d 0%,#c4001d 55%,#5c0011 100%);--acc:#d1001f}
body{background:transparent!important}
html{background-attachment:fixed!important;background:
  radial-gradient(520px 380px at -5% -5%,rgba(255,31,61,.13),transparent 65%),
  radial-gradient(560px 460px at 105% 8%,rgba(106,44,245,.13),transparent 65%),
  radial-gradient(640px 460px at 40% 108%,rgba(0,194,168,.11),transparent 65%),
  radial-gradient(420px 320px at 100% 70%,rgba(255,194,26,.10),transparent 65%),#f3f4f9}
html{background-attachment:fixed}

/* en-tête */
header{background:var(--grad-main);box-shadow:0 8px 26px rgba(106,44,245,.28)}
header::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(300px 120px at 85% 0,rgba(255,255,255,.22),transparent 70%)}
.hbar{position:relative;z-index:1}
.brand span{margin-left:-6px}
.brand i{background:#fff!important;color:#e5126b;box-shadow:0 4px 14px rgba(0,0,0,.2)!important}
header .brand span{color:#ffe14d}
header .pill{background:rgba(255,255,255,.17)!important;border-color:rgba(255,255,255,.28)!important;color:#fff}
header .pill.coin b{color:#ffe14d} header .pill.dia b{color:#c9ecff}
header .pill.fire b{color:#ffe14d}
.pill.user{gap:7px;padding:4px 12px 4px 4px}
.pill.user .av,.pill.user .frm{width:28px;height:28px}
.pill.user .frm .av{width:24px;height:24px;font-size:10px}
.pill.user .av{font-size:11px}
nav#nav{position:relative;z-index:1}
nav#nav button{color:rgba(255,255,255,.78)}
nav#nav button.on{color:#fff;border-color:#ffe14d}
nav .badge{background:#ffe14d;color:#3b1fa8}
@media (max-width:560px){.pill.fire{display:none!important}.pill.user .un{display:none}.pill.user{padding:4px}}

/* invité */
.guest{display:flex;gap:12px;align-items:center;justify-content:space-between;background:linear-gradient(120deg,#0d1220,#2a1450 70%,#4a1fd0);color:#fff;border-radius:20px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--sh2)}
.guest b{display:block;font-size:16px;margin-bottom:2px}
.guest span{font-size:12.5px;opacity:.88;line-height:1.4}

.guest button{flex:0 0 auto;background:#ffe14d;color:#2a1450;font-weight:800;padding:11px 14px;border-radius:12px;box-shadow:0 4px 12px rgba(255,225,77,.35)}

/* tuiles du tableau de bord */
.dash{display:flex;gap:10px;overflow-x:auto;margin:0 -16px 14px;padding:2px 16px 8px;scrollbar-width:none;scroll-snap-type:x proximity}
.dash::-webkit-scrollbar{display:none}
.tile{flex:0 0 148px;scroll-snap-align:start;text-align:left;display:flex;flex-direction:column;gap:3px;padding:13px;border-radius:20px;color:#fff;position:relative;overflow:hidden;box-shadow:0 8px 18px rgba(13,18,32,.13);transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile::after{content:"";position:absolute;right:-28px;top:-28px;width:88px;height:88px;border-radius:50%;background:rgba(255,255,255,.16)}
.tile .ti{font-size:26px;margin-bottom:4px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.18))}
.tile b{font-size:14.5px;line-height:1.2}
.tile span{font-size:11.5px;opacity:.92;line-height:1.3}
.t-coin{background:linear-gradient(135deg,#ffc21a,#ff7a1a)}
.t-fire{background:linear-gradient(135deg,#ff5a1a,#e5126b)}
.t-gift{background:linear-gradient(135deg,#18b85c,#00a3a3)}
.t-league{background:linear-gradient(135deg,#1f7bff,#6a2cf5)}

/* classements */
.seg.mini{display:flex;margin-bottom:12px}.seg.mini button{flex:1}

/* notifications */

}

/* ---------- Modèle de cotes : on part des cotes du vainqueur pour calculer les autres marchés ---------- */
const GRID=[];for(let i=1;i<=120;i++)GRID.push(i*0.05);
const PV=GRID.map(l=>{const v=[];for(let k=0;k<=14;k++)v.push(pois(k,l));return v});
const CV=PV.map(v=>{const c=[];let s=0;for(let k=0;k<=14;k++){c.push(s);s+=v[k]}return c});
function fitGoals(o){
  const inv=o.map(x=>1/x),s=inv[0]+inv[1]+inv[2],q=inv.map(x=>x/s);
  let best=1e9,bi=20,bj=20;
  for(let i=0;i<GRID.length;i++){const A=PV[i];
    for(let j=0;j<GRID.length;j++){const B=PV[j],C=CV[j];let p1=0,pn=0;
      for(let x=0;x<=14;x++){p1+=A[x]*C[x];pn+=A[x]*B[x]}
      const e=(p1-q[0])**2+(pn-q[1])**2+(1-p1-pn-q[2])**2;
      if(e<best){best=e;bi=i;bj=j}}}
  return[GRID[bi],GRID[bj]];
}
function fitHockey(o,T){ // total de buts fixé (≈6 en NHL), on ajuste la répartition sur les cotes 1 et 2
  const t=1/o[0]/(1/o[0]+1/o[2]);let best=1e9,bk=.5;
  for(let k=0.15;k<=0.85;k+=0.005){const lh=T*k,la=T*(1-k);let p1=0,p2=0;
    for(let i=0;i<=14;i++)for(let j=0;j<=14;j++){const p=pois(i,lh)*pois(j,la);if(i>j)p1+=p;else if(j>i)p2+=p}
    const e=Math.abs(p1/(p1+p2)-t);if(e<best){best=e;bk=k}}
  return[T*bk,T*(1-bk)];
}

function setsDist(p,bo){

  return d;
}
function invPhi(p){ // approximation de la loi normale inverse
  const a=[-39.69683028665376,220.9460984245205,-275.9285104469687,138.357751867269,-30.66479806614716,2.506628277459239],b=[-54.47609879822406,161.5858368580409,-155.6989798598866,66.80131188771972,-13.28068155211218],c=[-0.007784894002430293,-0.3223964580411365,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783],dd=[0.007784695709041462,0.3224671290700398,2.445134137142996,3.754408661907416];
  const pl=0.02425;let q,r;
  if(p<pl){q=Math.sqrt(-2*Math.log(p));return(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((dd[0]*q+dd[1])*q+dd[2])*q+dd[3])*q+1)}
  if(p>1-pl){q=Math.sqrt(-2*Math.log(1-p));return-(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((dd[0]*q+dd[1])*q+dd[2])*q+dd[3])*q+1)}
  q=p-0.5;r=q*q;return(((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
}
function pointsDist(p,tl){
  const sdM=12,sdT=16,mu=sdM*invPhi(Math.min(.995,Math.max(.005,p))),d=[];
  const g=(x,s)=>Math.exp(-x*x/(2*s*s));
  for(let D=-60.5;D<=60.5;D+=1){const wD=g(D-mu,sdM);if(wD<1e-6)continue;
    for(let T=-60;T<=60;T+=2){const wT=g(T,sdT);d.push([(tl+T+D)/2,(tl+T-D)/2,wD*wT])}}
  return{d,mu};
}
function points3Dist(o,tl,sdM){
  const p1=1/o[0],p2=1/o[2],mu=sdM*invPhi(Math.min(.995,Math.max(.005,p1/(p1+p2)))),sdT=Math.max(6,tl*0.22),d=[];
  const g=(x,s)=>Math.exp(-x*x/(2*s*s));
  for(let D=-Math.round(5*sdM);D<=Math.round(5*sdM);D++){const wD=g(D-mu,sdM);if(wD<1e-6)continue;
    for(let T=-Math.round(3*sdT);T<=Math.round(3*sdT);T+=2){d.push([(tl+T+D)/2,(tl+T-D)/2,wD*g(T,sdT)])}}
  return{d,mu};
}

    else if(sp==='foot'||sp==='hockey'){
      const lam=sp==='hockey'?fitHockey(r.o,r.tl||6):fitGoals(r.o),d=[];for(let i=0;i<=14;i++)for(let j=0;j<=14;j++)d.push([i,j,pois(i,lam[0])*pois(j,lam[1])]);m.dist=d;
    }else if(sp==='basket'){const pd=pointsDist(p2way(r.o),r.tl||200);m.dist=pd.d;m.hl=-(Math.round(pd.mu)+(pd.mu>=0?0.5:-0.5))}
    else if(sp==='rugby'||sp==='hand'){const cfg=sp==='rugby'?RUGBY:HAND,pd=points3Dist(r.o,r.tl||cfg.tl,cfg.sd);m.dist=pd.d;m.hl=-(Math.round(pd.mu)+(pd.mu>=0?0.5:-0.5))}
    else if(sp==='mma')m.dist=mmaDist(p2way(r.o));
    else m.dist=setsDist(p2way(r.o),m.bo);
    if((sp==='basket'||sp==='rugby'||sp==='hand')&&m.hl==null)m.hl=-0.5;
    let t=0;for(const x of m.dist)t+=x[2];m.tot=t;
    return m;
  }).sort((a,b)=>a.ko-b.ko);
}
function findMatch(id){const d=id.split('_')[0];return(FIX[d]||[]).find(m=>m.id===id)}
function mkTitle(mk,m){return typeof mk.title==='function'?mk.title(m):mk.title}
function marketOf(m,mk){return marketsOf(m).find(k=>k.key===mk)||null}
function getOpt(m,mk,opt){const K=marketOf(m,mk);if(!K)return null;return K.opts(m).find(o=>o.id===opt)||null}
function oddsOf(m,mk,opt){
  if(mk==='1x2'){const i={'1':0,'N':1,'2':2}[opt];return m.o[i]}
  if(mk==='win'){return m.o[opt==='1'?0:1]}
  const key=mk+'|'+opt;if(key in m._o)return m._o[key];
  const o=getOpt(m,mk,opt);if(!o)return null;
  let p=0;for(const x of m.dist)if(o.fn(x[0],x[1],x[3]))p+=x[2];
  p/=m.tot;
  const v=p<0.004?null:Math.min(250,Math.max(1.01,Math.floor(100/(p*1.065))/100));
  return m._o[key]=v;
}
function status(m){
  if(m.x)return'annule';
  if(m.s)return'fini';
  if(Date.now()>=m.ko)return'live';
  return'avenir';
}

  const txt=await r.text();let data=null;try{data=txt?JSON.parse(txt):null}catch(e){}
  if(!r.ok){const e=new Error((data&&data.message)||('Erreur '+r.status));e.code=data&&data.message;throw e}
  return data;
}

async function loadFixtures(){
  const days=new Set([addDays(today(),-1),today(),addDays(today(),1)]);
  for(const b of state.bets)if(b.status==='pending')for(const s of b.sels)days.add(s.matchId.split('_')[0]);
  for(const d of state.defis||[])if(d.status==='pending')days.add(d.matchId.split('_')[0]);
  let changed=false;const v=Math.floor(Date.now()/60000);
  await Promise.all([...days].map(async d=>{
    try{const r=await fetch('fixtures/'+d+'.json?v='+v,{cache:'no-store'});
      if(!r.ok)return;const arr=await r.json();
      if(Array.isArray(arr)){build(d,arr);changed=true}}catch(e){}
  }));
  lastSync=Date.now();
  tick(changed);

const streakBonus=n=>Math.min(Math.max(n,1),7)*100;
function streakDots(n){let h='<div class="sdots">';const f=n>7?7:n;for(let i=1;i<=7;i++)h+='<div class="'+(i<=f?'on':'')+'">J'+i+'<br>+'+i*100+'</div>';return h+'</div>'}
function daily(){
  let ch=false;
  if(!state.week||state.week.id!==weekId()){state.week={id:weekId(),earned:0};ch=true}
  if(!state.streak)state.streak={n:0,last:null};
  if(!state.defis)state.defis=[];
  if(state.day!==today()){
    state.day=today();state.coins=DAILY;
    if(state.bets.length>300)state.bets=state.bets.slice(-300);
    if(!session)toast('☀️ Nouvelle journée : vous avez '+nf(DAILY)+' pièces !');
    ch=true;
  }
  if(session&&synced&&state.streak.last!==today()){
    const s=state.streak;s.n=s.last===addDays(today(),-1)?s.n+1:1;s.last=today();
    const bonus=streakBonus(s.n);state.coins+=bonus;ch=true;
    setTimeout(()=>celebrate('🔥','Série de '+s.n+' jour'+(s.n>1?'s':''),nf(DAILY)+' pièces du jour + <b>'+nf(bonus)+' pièces de bonus</b> !<br>Revenez demain pour <b>+'+nf(streakBonus(s.n+1))+'</b>.',streakDots(s.n)),600);
  }
  return ch;
}
function settle(){
  let ch=false;
  for(const b of state.bets){
    if(b.status!=='pending')continue;
    const ms=b.sels.map(s=>findMatch(s.matchId));
    if(ms.some(m=>!m||(status(m)!=='fini'&&status(m)!=='annule')))continue;
    let won=true,odds=1,allVoid=true;
    b.sels.forEach((s,i)=>{const m=ms[i];
      if(status(m)==='annule'){s.void=true;return}
      allVoid=false;const o=getOpt(m,s.mk,s.opt);
      if(!(o&&o.fn(m.s[0],m.s[1],m.s[2])))won=false;else odds*=s.odds});
    if(b.boost)odds*=1.1;
    if(allVoid){b.status='void';b.payout=b.stake;state.diamonds+=b.stake;toast('↩️ Match annulé : mise rendue ('+nf(b.stake)+' 💎)')}
    else if(won){
      b.odds=Math.round(odds*100)/100;b.status='won';b.payout=Math.round(b.stake*b.odds);state.diamonds+=b.payout;
      state.stats.won++;state.stats.earned+=b.payout;state.stats.best=Math.max(state.stats.best,b.odds);
      if(state.week)state.week.earned+=b.payout;
      toast('🎉 Pari gagné ! +'+nf(b.payout)+' 💎');
    }else{
      b.status='lost';b.payout=0;state.stats.lost++;
      if(b.shield){b.refund=b.stake;state.diamonds+=b.stake;toast('🛡️ Pari perdu, mais assuré : +'+nf(b.stake)+' 💎')}
    }
    b.settledAt=Date.now();ch=true;
  }
  for(const d of state.defis||[]){
    if(d.status!=='pending')continue;
    const m=findMatch(d.matchId);if(!m)continue;const st=status(m);
    if(st==='annule'){d.status='void';ch=true}
    else if(st==='fini'){const o=getOpt(m,d.mk,d.opt);
      if(o&&o.fn(m.s[0],m.s[1],m.s[2])){d.status='won';state.diamonds+=DEFI_GAIN;if(state.week)state.week.earned+=DEFI_GAIN;toast('🎯 Défi du jour réussi ! +'+DEFI_GAIN+' 💎')}
      else d.status='lost';ch=true}
  }
  return ch;
}

const selKey=s=>s.matchId+'|'+s.mk+'|'+s.opt;
function inSlip(id,mk,opt){return ui.slip.some(s=>s.matchId===id&&s.mk===mk&&s.opt===opt)}
function toggleSel(id,mk,opt){
  const i=ui.slip.findIndex(s=>s.matchId===id&&s.mk===mk&&s.opt===opt);
  if(i>=0)ui.slip.splice(i,1);
  else{
    if(ui.slip.length>=12){toast('12 sélections maximum');return}
    const s={matchId:id,mk,opt};ui.slip.push(s);
    if(!(selKey(s) in ui.stakes))ui.stakes[selKey(s)]=100;
  }
  renderSlip();renderView();
}
function slipCalc(){
  const sels=ui.slip.map(s=>{const m=findMatch(s.matchId);return{...s,m,odds:m?oddsOf(m,s.mk,s.opt):1,open:m&&status(m)==='avenir'}}).filter(s=>s.m);
  const single=(ui.mode==='simple'&&sels.length===1)||(ui.mode==='combi'&&sels.length>=2);
  const boostOn=ui.boost&&single&&state.inv.boost>0, shieldOn=ui.shield&&single&&state.inv.shield>0;
  let total=0,gain=0,err='',combiOdds=1;
  if(ui.mode==='simple'){
    for(const s of sels){const st=Math.max(0,Math.floor(+ui.stakes[selKey(s)]||0));total+=st;gain+=st*s.odds*(boostOn?1.1:1)}
  }else{
    for(const s of sels)combiOdds*=s.odds;
    combiOdds=Math.round(combiOdds*(boostOn?1.1:1)*100)/100;
    total=Math.max(0,Math.floor(+ui.combi||0));gain=total*combiOdds;
    const ids=sels.map(s=>s.matchId);
    if(sels.length<2)err='Un combiné demande au moins 2 sélections.';
    else if(new Set(ids).size!==ids.length)err='Un combiné ne peut pas contenir 2 paris sur le même match.';
  }
  if(!err&&sels.some(s=>!s.open))err='Un des matchs a commencé : retirez-le du coupon.';
  if(!err&&total>state.coins)err='Pas assez de pièces (il vous reste '+nf(state.coins)+').';
  if(!err&&sels.length&&(ui.mode==='simple'?sels.some(s=>!(Math.floor(+ui.stakes[selKey(s)]||0)>0)):!(total>0)))err='Indiquez une mise pour chaque pari.';
  return{sels,single,boostOn,shieldOn,total,gain,err,combiOdds};
}
function placeBets(){
  const c=slipCalc();if(c.err||!c.sels.length)return;
  const snap=s=>({matchId:s.matchId,mk:s.mk,opt:s.opt,odds:s.odds,match:s.m.home+' – '+s.m.away,market:mkTitle(marketOf(s.m,s.mk),s.m),pick:getOpt(s.m,s.mk,s.opt).label,comp:s.m.flag+' '+s.m.comp,ko:s.m.ko});
  const base={placedAt:Date.now(),status:'pending',boost:c.boostOn,shield:c.shieldOn};
  if(ui.mode==='simple'){
    for(const s of c.sels){const st=Math.floor(+ui.stakes[selKey(s)]);state.bets.push({...base,id:uid(),type:'Simple',sels:[snap(s)],stake:st,odds:Math.round(s.odds*(c.boostOn?1.1:1)*100)/100})}
  }else{
    state.bets.push({...base,id:uid(),type:'Combiné ('+c.sels.length+')',sels:c.sels.map(snap),stake:Math.floor(+ui.combi),odds:c.combiOdds});
  }
  state.coins-=c.total;
  if(c.boostOn)state.inv.boost--;
  if(c.shieldOn)state.inv.shield--;
  ui.slip=[];ui.boost=false;ui.shield=false;
  save();
  $('#aside').classList.remove('open');
  renderAll();
  const last=state.bets[state.bets.length-1];
  popup('<div class="pop-ic big">✅</div><h3>Pari validé !</h3><p><b>'+nf(c.total)+' pièces</b> misées · gain possible <b style="color:#1f7bff">'+nf(c.gain)+' 💎</b></p><div class="pop-btns"><button class="pbtn" data-sharebet="'+last.id+'">📤 Partager mon coupon</button><button class="pbtn ghost2" data-popclose="1">Continuer</button></div>'+(notifSupport()&&!notifOn()?'<button class="later" data-notifs="1">🔔 Me prévenir quand le résultat tombe</button>':''));
}

function rr(x,X,Y,W,H,R){x.beginPath();x.moveTo(X+R,Y);x.arcTo(X+W,Y,X+W,Y+H,R);x.arcTo(X+W,Y+H,X,Y+H,R);x.arcTo(X,Y+H,X,Y,R);x.arcTo(X,Y,X+W,Y,R);x.closePath()}
function fitT(x,t,w){t=String(t);if(x.measureText(t).width<=w)return t;while(t.length>1&&x.measureText(t+'…').width>w)t=t.slice(0,-1);return t+'…'}
function betImage(b){
  const W=1080,sels=b.sels.slice(0,6),rowH=132,cardH=60+sels.length*rowH+(b.sels.length>6?50:0)+170,H=Math.max(1350,360+cardH+260);
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#ff1f3d');g.addColorStop(.5,'#d4148f');g.addColorStop(1,'#4a1fd0');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.globalAlpha=.13;x.fillStyle='#fff';x.beginPath();x.arc(W-90,150,260,0,7);x.fill();x.beginPath();x.arc(60,H-140,240,0,7);x.fill();x.globalAlpha=1;
  const F='Inter, system-ui, -apple-system, "Segoe UI", sans-serif';
  x.fillStyle='#fff';x.font='800 60px '+F;x.textBaseline='alphabetic';x.fillText('⚽ PronoClub',70,125);

  x.font='900 96px '+F;x.fillText(title,70,255);
  x.globalAlpha=.88;x.font='600 38px '+F;x.fillText(fitT(x,b.type+(session?' · par '+session.pseudo:''),W-140),72,315);x.globalAlpha=1;
  const cy=360+Math.max(0,(H-(360+cardH+260))/2);x.fillStyle='#fff';rr(x,50,cy,W-100,cardH,40);x.fill();
  let y=cy+40;
  sels.forEach((s,i)=>{
    if(i){x.fillStyle='#eceef4';x.fillRect(90,y-10,W-180,3)}

    x.fillStyle='#111827';x.font='800 40px '+F;x.fillText(fitT(x,s.pick,W-380),90,y+92);

  const by=cy+cardH-170;x.fillStyle='#f4f5fa';rr(x,80,by,W-160,130,28);x.fill();
  const col=(lbl,val,cx,color)=>{x.textAlign='center';x.fillStyle='#7a8396';x.font='700 28px '+F;x.fillText(lbl,cx,by+50);x.fillStyle=color;x.font='900 42px '+F;x.fillText(val,cx,by+102);x.textAlign='left'};
  col('Mise',nf(b.stake)+' 🪙',W*0.22,'#111827');col('Cote',fo(b.odds),W*0.5,'#e0182d');col(won?'Gagné':'Gain possible',nf(won?b.payout:b.stake*b.odds)+' 💎',W*0.78,'#1f6fe0');
  x.fillStyle='#fff';x.textAlign='center';x.font='800 44px '+F;x.fillText('Parie gratuitement avec moi 👇',W/2,H-150);
  x.font='700 36px '+F;x.globalAlpha=.92;x.fillText(SITE().replace(/^https?:\/\//,'').replace(/\/$/,''),W/2,H-90);x.globalAlpha=1;x.textAlign='left';
  return new Promise(r=>c.toBlob(r,'image/png'));

function defiMatch(){
  const d=defiToday();if(d){const m=findMatch(d.matchId);if(m)return m}
  const list=(FIX[today()]||[]).filter(m=>status(m)==='avenir');
  if(!list.length)return null;
  return list.slice().sort((a,b)=>compRank(a)-compRank(b)||a.ko-b.ko)[0];
}
function defiCard(){
  const m=defiMatch();if(!m)return'';
  const d=defiToday(),k=marketsOf(m)[0],st=status(m),opts=k.opts(m);
  let foot='';
  if(d){const lbl=(getOpt(m,d.mk,d.opt)||{}).label||'';
    foot=d.status==='won'?'<div class="dres ok">✅ Bien joué ! +'+DEFI_GAIN+' 💎 gagnés</div>':d.status==='lost'?'<div class="dres">❌ Raté cette fois. Nouveau défi demain !</div>':d.status==='void'?'<div class="dres">Match annulé.</div>':'<div class="dres">Votre choix : <b>'+esc(d.opt==='N'?'Match nul':lbl)+'</b> · réponse après le match</div>'}
  const btns=opts.map(o=>'<button class="dbtn'+(d&&d.opt===o.id?' on':'')+'" data-defi="'+m.id+'|'+k.key+'|'+o.id+'" '+(d||st!=='avenir'?'disabled':'')+'>'+esc(o.id==='N'?'Nul':o.label)+'</button>').join('');
  return '<div class="defi"><div class="defi-h"><span class="defi-tag">🎯 Défi du jour</span><span>Gratuit · <b>+'+DEFI_GAIN+' 💎</b> si vous avez bon</span></div>'+
    '<div class="defi-q">Qui gagne <b>'+esc(m.home)+' – '+esc(m.away)+'</b> ?</div><div class="defi-s">'+SPORTS[m.sp].ic+' '+esc(m.comp)+' · '+whenHtml(m).replace(/<[^>]+>/g,'')+'</div>'+
    '<div class="defi-o'+(opts.length===3?'':' two')+'">'+btns+'</div>'+foot+'</div>';
}
function pageHero(cls,ic,title,sub){return '<div class="phero '+cls+'" data-ic="'+ic+'"><b>'+title+'</b><span>'+sub+'</span></div>'}
function liveMatches(){
  const t=today();let all=[];
  for(const d of [addDays(t,-1),t,addDays(t,1)])all=all.concat(FIX[d]||[]);
  return all;
}
function renderLive(){
  const all=liveMatches();
  const lim=m=>m.ko+(m.sp==='foot'?150:m.sp==='basket'?170:200)*60e3;
  const live=all.filter(m=>status(m)==='live'&&Date.now()<lim(m)).sort((a,b)=>a.ko-b.ko);
  const wait=all.filter(m=>status(m)==='live'&&Date.now()>=lim(m)).sort((a,b)=>b.ko-a.ko);
  const done=all.filter(m=>status(m)==='fini'&&Date.now()-m.ko<20*3600e3).sort((a,b)=>b.ko-a.ko);
  const soon=all.filter(m=>status(m)==='avenir'&&m.ko-Date.now()<2*3600e3).sort((a,b)=>a.ko-b.ko);
  const myBets=m=>state.bets.filter(b=>b.status==='pending'&&b.sels.some(s=>s.matchId===m.id));
  const ago=m=>{const mn=Math.max(0,Math.round((Date.now()-m.ko)/60000));return mn<60?mn+' min':Math.floor(mn/60)+' h '+String(mn%60).padStart(2,'0')};
  const q=m=>'https://www.google.com/search?q='+encodeURIComponent(m.home+' '+m.away+' score');
  const card=(m,kind)=>{
    const bets=myBets(m),late=kind==='live'&&Date.now()>m.ko+(m.sp==='foot'?150:m.sp==='basket'?170:200)*60e3;
    const st=kind==='live'?(late?'<span class="st done">Terminé · résultat bientôt</span>':'<span class="st live">● En direct</span><span class="lv-t">commencé il y a '+ago(m)+'</span>'):kind==='done'?'<span class="st done">Terminé</span>':'<span class="st">Dans '+Math.max(1,Math.round((m.ko-Date.now())/60000))+' min</span>';
    const res=kind==='done'?m.s:null,sc=i=>res&&m.sp!=='mma'?'<b class="sc'+(res[i]>res[1-i]?' win':'')+'">'+res[i]+'</b>':'';
    let h='<article class="mc lv" style="--sc:'+SPORTS[m.sp].col+'"><div class="mc-h">'+st+'<span class="mc-c">'+SPORTS[m.sp].ic+' '+esc(m.comp)+'</span></div>'+
      '<div class="mc-t"><span>'+avatar(m.home)+'<i>'+esc(m.home)+'</i>'+sc(0)+'</span><span>'+avatar(m.away)+'<i>'+esc(m.away)+'</i>'+sc(1)+'</span></div>';
    if(kind==='done'&&m.sp==='mma')h+='<p class="lv-r">'+esc(scoreTxt(m))+'</p>';
    if(bets.length)h+='<div class="lv-b">🎟️ <b>'+bets.length+' pari'+(bets.length>1?'s':'')+' en cours</b> · mise '+nf(bets.reduce((a,b)=>a+b.stake,0))+' 🪙 · gain possible '+nf(bets.reduce((a,b)=>a+b.stake*b.odds,0))+' 💎</div>';
    if(kind==='live')h+='<a class="lv-l" href="'+q(m)+'" target="_blank" rel="noopener">Voir le score en direct ↗</a>';
    if(kind==='soon')h+='<button class="lv-l" data-go="'+m.sp+'">Parier avant le coup d\'envoi →</button>';
    return h+'</article>';
  };
  const sec=(title,list,kind,empty)=>'<h3 class="day">'+title+(list.length?' <small class="cnt">'+list.length+'</small>':'')+'</h3>'+(list.length?list.map(m=>card(m,kind)).join(''):'<div class="empty small">'+empty+'</div>');
  return pageHero('ph-live','📡','Live','Les matchs en cours et vos paris en attente. Les paris sont fermés une fois le match commencé, et réglés dès que le résultat officiel est publié.')+
    sec('En direct',live,'live','Aucun match en cours pour le moment.')+
    sec('Bientôt',soon,'soon','Aucun match dans les 2 prochaines heures.')+
    (wait.length?sec('En attente du résultat',wait,'live',''):'')+
    sec('Résultats récents',done,'done','Pas encore de résultats.');
}
function renderBets(){
  const s=state.stats,tot=s.won+s.lost;
  const list=state.bets.filter(b=>ui.betFilter==='pending'?b.status==='pending':b.status!=='pending').slice().reverse();
  const card=b=>{
    const tag=b.status==='pending'?'<span class="tag pending">En cours</span>':b.status==='won'?'<span class="tag won">Gagné +'+nf(b.payout)+' 💎</span>':b.status==='void'?'<span class="tag pending">Annulé · mise rendue</span>':'<span class="tag lost">Perdu'+(b.refund?' · remboursé '+nf(b.refund)+' 💎':'')+'</span>';
    const lines=b.sels.map(x=>{const m=findMatch(x.matchId);let mark='',score='';
      if(m&&status(m)==='fini'){const o=getOpt(m,x.mk,x.opt),ok=o&&o.fn(m.s[0],m.s[1],m.s[2]);mark='<span class="mark '+(ok?'ok':'ko')+'">'+(ok?'✓':'✗')+'</span>';score=' · '+scoreTxt(m)}
      else if(m&&status(m)==='annule')score=' · '+m.x;
      else if(m&&status(m)==='live')score=' · en cours';else score=' · '+hhmm(x.ko||(m&&m.ko));
      return '<div class="bl"><div><div><b>'+esc(x.pick)+'</b> <span style="color:var(--acc);font-weight:700">'+fo(x.odds)+'</span></div><div class="s">'+esc(x.market)+'</div><div class="s">'+esc(x.match)+score+'</div></div>'+mark+'</div>'}).join('');
    return '<div class="bet '+b.status+'"><div class="bh"><b>'+b.type+(b.boost?' 🚀':'')+(b.shield?' 🛡️':'')+'</b>'+tag+'</div>'+lines+
      '<div class="bf"><span>Mise <b>'+nf(b.stake)+' 🪙</b></span><span>Cote <b>'+fo(b.odds)+'</b></span><span>Gain possible <b>'+nf(b.stake*b.odds)+' 💎</b></span></div>'+
      (b.status!=='void'?'<button class="sharebtn" data-sharebet="'+b.id+'">📤 Partager ce pari</button>':'')+'</div>'};
  return pageHero('ph-bets','🧾','Mes paris','Réglés automatiquement dès que le résultat réel du match est publié. Partagez vos plus beaux coupons !')+
   '<div class="stats"><div class="stat"><small>Paris gagnés</small><b>'+s.won+' / '+tot+'</b></div><div class="stat"><small>Réussite</small><b>'+(tot?Math.round(s.won/tot*100):0)+' %</b></div><div class="stat"><small>Diamants gagnés</small><b style="color:var(--dia)">'+nf(s.earned)+'</b></div><div class="stat"><small>Plus grosse cote gagnée</small><b>'+(s.best?fo(s.best):'–')+'</b></div></div>'+
   '<div class="toolbar"><div class="seg"><button data-bf="pending" class="'+(ui.betFilter==='pending'?'on':'')+'">En cours</button><button data-bf="done" class="'+(ui.betFilter==='done'?'on':'')+'">Terminés</button></div></div>'+
   (list.length?list.map(card).join(''):'<div class="empty">'+(ui.betFilter==='pending'?'Aucun pari en cours. Choisissez une cote dans l\'onglet Matchs !':'Aucun pari terminé pour l\'instant.')+'</div>');
}

/* ---------- Chat ---------- */
const chat={msgs:[],last:0,timer:null,state:'loading',sending:false};
const CHAT_ERR={trop_vite:'Doucement : attendez quelques secondes entre deux messages.',trop_long:'Message trop long (300 caractères maximum).',vide:'Écrivez un message.',session:ERR.session};
function chatSeen(){return +(lsGet('pc_chat_seen')||0)}
function chatUnread(){const me=session&&session.pseudo.toLowerCase(),s=chatSeen();return chat.msgs.filter(m=>m.id>s&&m.pseudo.toLowerCase()!==me).length}
function markChatSeen(){if(chat.last)lsSet('pc_chat_seen',String(chat.last));updateChatBadge()}
function updateChatBadge(){const n=ui.tab==='chat'?0:chatUnread(),b=document.getElementById('bnChat');if(b){b.textContent=n>9?'9+':(n||'');b.style.display=n?'':'none'}
  document.querySelectorAll('#nav button[data-tab="chat"]').forEach(x=>x.textContent=n?'💬 Social ('+n+')':'💬 Social')}
async function chatPoll(){
  try{const r=await rpc('chat_lire',{p_apres:chat.last});chat.state='ok';
    if(Array.isArray(r)&&r.length){chat.msgs=chat.msgs.concat(r).slice(-200);chat.last=r[r.length-1].id;
      if(ui.tab==='chat'&&ui.social==='chat'){renderChatList();if(document.visibilityState==='visible')markChatSeen()}}
    else if(ui.tab==='chat'&&ui.social==='chat'&&!document.getElementById('chatList').dataset.ready)renderChatList();
  }catch(e){chat.state=/function|404|PGRST/i.test(e.message||'')?'off':'err';if(ui.tab==='chat'&&ui.social==='chat')renderChatList()}
  updateChatBadge();
}
function chatSchedule(){clearTimeout(chat.timer);const fast=ui.tab==='chat'&&document.visibilityState==='visible';chat.timer=setTimeout(async()=>{await chatPoll();chatSchedule()},fast?4000:45000)}
function chatSoon(){clearTimeout(chat.timer);chatPoll().then(chatSchedule)}
function chatTime(t){const d=new Date(t),k=dkey(d);return (k===today()?'':d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+' ')+hhmm(t)}
function chatListHtml(){
  if(chat.state==='off')return '<div class="chat-empty">💬 Le chat n\'est pas encore activé.<br><small>Il faut ajouter la partie « chat » dans Supabase.</small></div>';
  if(chat.state==='loading'&&!chat.msgs.length)return '<div class="chat-empty">Chargement des messages…</div>';
  if(!chat.msgs.length)return '<div class="chat-empty">👋 Aucun message pour l\'instant.<br>Lancez la discussion !</div>';
  const me=session&&session.pseudo.toLowerCase();let prev=null;
  return chat.msgs.map(m=>{const mine=m.pseudo.toLowerCase()===me,same=prev&&prev.pseudo===m.pseudo&&(new Date(m.cree_le)-new Date(prev.cree_le))<300000;prev=m;
    return '<div class="cm'+(mine?' me':'')+(same?' same':'')+'">'+(!mine&&!same?pav(m.pseudo,m.deco):'<span class="av-sp"></span>')+'<div class="cb">'+(!same?'<div class="cn">'+(mine?'Vous':pname(m.pseudo,m.deco))+' <small>'+chatTime(m.cree_le)+'</small></div>':'')+'<div class="ct">'+esc(m.texte)+'</div></div></div>'}).join('')+(chat.state==='err'?'<div class="chat-empty small">Connexion perdue, nouvelle tentative…</div>':'');
}
function renderChatList(){
  const el=document.getElementById('chatList');if(!el)return;
  const atBottom=el.scrollHeight-el.scrollTop-el.clientHeight<80||!el.dataset.ready;
  el.innerHTML=chatListHtml();el.dataset.ready='1';
  if(atBottom)el.scrollTop=el.scrollHeight;
}

      :'<div class="chat-login"><button class="btn" data-auth="login">Connectez-vous pour écrire</button></div>')+

document.addEventListener('submit',async e=>{
  if(e.target.id!=='chatForm')return;
  e.preventDefault();
  if(!session){ui.authMode='login';openAuth();return}
  const inp=$('#chatIn'),txt=inp.value.trim(),er=$('#chatErr');
  if(!txt||chat.sending)return;
  chat.sending=true;er.textContent='';
  try{const m=await rpc('chat_envoyer',{p_token:session.token,p_texte:txt});
    inp.value='';ui.chatDraft='';
    await chatPoll();if(m&&!chat.msgs.some(x=>x.id===m.id)){chat.msgs.push(m);chat.last=Math.max(chat.last,m.id)}
    const el=document.getElementById('chatList');if(el)el.dataset.ready='';renderChatList();markChatSeen();
  }catch(err){er.textContent=CHAT_ERR[err.code]||(/function|404|PGRST/i.test(err.message||'')?'Le chat n\'est pas encore activé.':'Envoi impossible, réessayez.');if(err.code==='session')logout(ERR.session)}
  chat.sending=false;inp.focus();
});
document.addEventListener('input',e=>{if(e.target.id==='chatIn')ui.chatDraft=e.target.value});

document.addEventListener('input',e=>{
  const d=e.target.dataset;
  if(d.stake!==undefined){const v=e.target.value;if(d.stake==='__combi')ui.combi=v;else ui.stakes[d.stake]=v;refreshSlipNumbers()}
});

/* ---------- Boucle ---------- */
function tick(force){
  const a=daily(),b=settle();
  if(a||b)save();
  renderHeader();
  const focused=(document.activeElement&&document.activeElement.matches('input'))||(ui.tab==='chat'&&ui.social==='chat');
  if(!focused){renderView();renderSlip()}
}
tick(true);
loadFixtures();
setInterval(()=>tick(false),20000);
setInterval(loadFixtures,3*60*1000);
if(session)refreshFromServer();
else if(!lsGet('pc_welcome')){lsSet('pc_welcome','1');const par=lsGet('pc_parrain');
  popup('<div class="pop-ic big">⚽</div><h3>Bienvenue sur PronoClub</h3><p>Pariez <b>gratuitement</b> sur les vrais matchs : foot, basket, tennis, rugby… <b>'+nf(DAILY)+' pièces offertes chaque jour</b>, des diamants à gagner et des défis entre amis.'+(par?'<br><br>🎁 <b>'+esc(par)+'</b> vous offre <b>'+PARRAIN_BONUS+' pièces</b> à l\'inscription !':'')+'</p><div class="pop-btns"><button class="pbtn" data-auth="signup">Créer mon compte</button><button class="pbtn ghost2" data-popclose="1">Visiter d\'abord</button></div>')}
chatSoon();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){loadFixtures();refreshFromServer()}});
</script>
</body>
</html>
